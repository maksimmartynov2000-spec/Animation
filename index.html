        'Стража = 🔗 соперника на столе + способности + 🎲. Сила больше — успех; ничья — провал.',
        'Откуп: жертва может заплатить в банк 2🪙 за каждое очко перевеса — тогда шпион ничего не получает. Платить выгодно, только когда откуп дешевле потери.',
      ];
      exs = [
        ex('Откуп не нужен', 'Шпион: 🔗3 + «Карманник» 1 + 🎲4 = 8. Стража: 🔗1 + 🎲3 = 4. Перевес 4 — откуп стоил бы 8🪙, а кража всего 2🪙. Выгоднее отдать 2🪙.'),
        ex('Откуп выгоден', 'Шантажист хочет забрать вашу Лавку — она приносит 4🪙 на вашем броске 4. Перевес 1 — откуп 2🪙. Выгоднее заплатить в банк 2🪙 и оставить Лавку.'),
      ];
      with_ = ['С «Замыслами»: «Саботажник» срывает замыслы. С «Сезонами»: зимой шпионаж +2.'];
    }
    const html = `<div class="mr">
      <p class="mr-gist">${gist}</p>
      ${houseLine}
      <h3>Что добавляется</h3>${ul(adds.concat([lordLine]))}
      <h3>Правила</h3>${ul(rules)}
      <h3>${exs.length > 1 ? 'Примеры' : 'Пример'}</h3>${exs.join('')}
      ${tips.length ? `<h3>${key === 'unions' ? 'Владения провинций' : 'Совет'}</h3><p class="mr-tip">${tips.join(' ')}</p>` : ''}
      <p class="mr-with"><b>С другими модулями.</b> ${with_.length ? with_.join(' ') + ' В остальном модуль ни от чего не зависит.' : 'Модуль ни от чего не зависит и сочетается с любым набором.'}</p>
    </div>`;
    return { key, icon: M.icon, name: M.name, short: M.short, html };
  }
  return { ORDER, page };
});

const ART = {"field": "art/field.svg", "bakery": "art/bakery.svg", "wall": "art/wall.svg", "pasture": "art/pasture.svg", "barracks": "art/barracks.svg", "runestone": "art/runestone.svg", "smithy": "art/smithy.svg", "mine": "art/mine.svg", "shop": "art/shop.svg", "winery": "art/winery.svg", "outpost": "art/outpost.svg", "den": "art/den.svg", "port": "art/port.svg", "caravan": "art/caravan.svg", "library": "art/library.svg", "fortress": "art/fortress.svg", "scriptorium": "art/scriptorium.svg", "alchemy": "art/alchemy.svg", "sawmill": "art/sawmill.svg", "thieves": "art/thieves.svg", "watchtower": "art/watchtower.svg", "orchard": "art/orchard.svg", "blackmarket": "art/blackmarket.svg", "tax": "art/tax.svg", "herald": "art/herald.svg", "chancellor": "art/chancellor.svg", "collector": "art/collector.svg", "spicer": "art/spicer.svg", "usurer": "art/usurer.svg", "guildmaster": "art/guildmaster.svg", "scribe": "art/scribe.svg", "astrologer": "art/astrologer.svg", "archivist": "art/archivist.svg", "alchemist": "art/alchemist.svg", "inventor": "art/inventor.svg", "mercenary": "art/mercenary.svg", "foragers": "art/foragers.svg", "siegeband": "art/siegeband.svg", "commander": "art/commander.svg", "pickpocket": "art/pickpocket.svg", "informer": "art/informer.svg", "saboteur": "art/saboteur.svg", "whisper": "art/whisper.svg", "blackmailer": "art/blackmailer.svg", "goldhorn": "art/goldhorn.svg", "owlsight": "art/owlsight.svg", "wolfpack": "art/wolfpack.svg", "thorn": "art/thorn.svg", "boarding": "art/boarding.svg", "moonlight": "art/moonlight.svg"};

// ===================== ДВИЖОК «ВЕЛИКИЕ ДОМА» =====================
const Engine = (() => {
  const D = (typeof DATA !== 'undefined') ? DATA : require('./data.js');
  const R = D.RULES;
  const SYMS = D.SYMS;

  let HOOKS = {};
  function setHooks(h) { HOOKS = h || {}; }
  function emit(S, type, data) { if (HOOKS.event) HOOKS.event(S, type, data); }
  function log(S, text, pi = null, kind = '') {
    S.log.push({ r: S.round, t: text, p: pi, k: kind });
    if (S.log.length > 500) S.log.shift();
    emit(S, 'log', { text, pi, kind });
  }
  async function pause(S, what) { if (HOOKS.delay) await HOOKS.delay(S, what); }

  // ---------- случайность (воспроизводимая) ----------
  function rnd(S) {
    S.seed = (S.seed + 0x6D2B79F5) | 0;
    let t = S.seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function shuffle(S, a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const d6 = (S) => 1 + Math.floor(rnd(S) * 6);
  const rollVals = (S, n) => n === 2 ? [d6(S), d6(S)] : [d6(S)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sum = (a) => a.reduce((s, x) => s + x, 0);

  // ---------- справочные функции ----------
  const ES = (e) => D.ESTATES[typeof e === 'string' ? e : e.id];
  const regDef = (p, id) => D.HOUSES[p.house].regalia.find(r => r.id === id);
  const regCount = (p) => p.regalia.length + p.great.length;
  const opps = (S, p) => S.players.filter(q => q !== p);
  const nm = (p) => `${D.HOUSES[p.house].sigil} ${p.name}`;
  // падежи названий Домов — из данных: «Змеи» → «Змей», «Олени (вы)» → «Оленей (вы)», «Змеям»
  const youOf = (p) => (/ \(вы\)$/.test(p.name) ? ' (вы)' : '');
  const nmG = (p) => `${D.HOUSES[p.house].sigil} ${D.HOUSES[p.house].gen}${youOf(p)}`;
  const nmD = (p) => `${D.HOUSES[p.house].sigil} ${D.HOUSES[p.house].dat}${youOf(p)}`;
  const short = (p) => D.HOUSES[p.house].short;
  const shortG = (p) => D.HOUSES[p.house].gen;
  // дописать итог к строке журнала, если после неё ничего не добавилось; иначе — отдельной строкой
  function logAppend(S, entry, tail, pi, kind) {
    const last = S.log[S.log.length - 1];
    if (last === entry) { entry.t += tail; emit(S, 'log', { text: entry.t, pi, kind, edit: true }); }
    else log(S, `   итог: ${tail.replace(/^[:,]\s*/, '')}`, pi, kind);
  }

  // ---------- модули (части правил, которые можно выключить) ----------
  // S.mod нет (старые сохранения) — значит включено всё
  const on = (S, k) => !S.mod || S.mod[k] !== false;
  const needGreat = (S) => (on(S, 'lords') ? R.greatNeeded : 0);
  const goal = (S) => R.ownRegalia + needGreat(S);
  const cardOn = (S, kind, id) => { const k = D.NEEDS && D.NEEDS[kind] && D.NEEDS[kind][id]; return !k || on(S, k); };
  const houseOn = (S, h) => cardOn(S, 'house', h);
  const seasonText = (S, se) => D.seasonText(se, (k) => on(S, k));

  function mods(S, p) {
    const m = {};
    const add = (o) => { if (!o) return; for (const k in o) m[k] = (m[k] || 0) + o[k]; };
    add(D.HOUSES[p.house].mods);
    for (const id of p.regalia) add(regDef(p, id).mods);
    for (const id of p.great) add(D.GREAT[id].mods);
    if (on(S, 'seasons')) add(D.SEASONS[S.seasonIdx].mods);
    if (S.titles.magister === p.i) add({ shift: 1 });
    if (S.titles.marshal === p.i) add({ siege: 1, defense: 2 });
    if (S.titles.whisperer === p.i) add({ hand: 1 });
    if (S.titles.treasurer === p.i) add({ startGold: 1 });
    return m;
  }
  // союз провинции: каждые 3 владения одной провинции (любые, можно одинаковые) — один союз; бонусы копятся
  // u.S — сколько союзов Юга (0, 1, 2…), u.counts.S — сколько владений Юга
  function unionsOf(p) {
    const c = { N: 0, S: 0, E: 0, W: 0 };
    for (const e of p.estates) { const d = ES(e); if (d.p) c[d.p]++; }
    return { N: Math.floor(c.N / 3), S: Math.floor(c.S / 3), E: Math.floor(c.E / 3), W: Math.floor(c.W / 3), counts: c };
  }
  const unionCount = (p) => { const u = unionsOf(p); return u.N + u.S + u.E + u.W; };
  function prod(S, p) {
    const r = { sci: 0, war: 0, int: 0 };
    for (const e of p.estates) { const d = ES(e); if (d.sym) r[d.sym]++; }
    for (const id of p.regalia) { const pr = regDef(p, id).prod; for (const k in pr) r[k] += pr[k]; }
    for (const id of p.great) { const pr = D.GREAT[id].prod; for (const k in pr) r[k] += pr[k]; }
    if (on(S, 'unions')) { const u = unionsOf(p); r.war += u.N; r.sci += u.E; r.int += u.W; }
    return r;
  }
  const sym = (S, p, s) => prod(S, p)[s] + (p.temp[s] || 0);
  function walls(S, p) {
    let w = R.baseWalls || 0;
    for (const e of p.estates) w += ES(e).walls || 0;
    w += mods(S, p).walls || 0;
    return w;
  }
  const handSize = (S, p) => R.hand + (mods(S, p).hand || 0);
  const plotSlots = (S, p) => (on(S, 'plots') ? R.plotSlots + (mods(S, p).plotSlots || 0) : 0);

  function freshTurn() {
    return { rolled: false, roles: {}, buysUsed: 0, buys: 0, discount: 0, regDiscount: 0, built: false, rerolls: 0, shifts: [], extraTurn: false };
  }

  // ---------- создание партии ----------
  function newGame(opts) {
    const S = {
      v: 1, seed: opts.seed != null ? opts.seed : (Math.random() * 2 ** 31) | 0, uid: 1, round: 1, cur: 0, first: 0,
      seasonIdx: 0, log: [], winner: null, lastRoll: null, players: [], turnNo: 0, extraTaken: false,
      titles: { treasurer: null, magister: null, marshal: null, whisperer: null },
    };
    // opts.modules: массив включённых модулей или объект {модуль: true/false}; нет — включено всё
    const om = opts.modules;
    S.mod = Object.fromEntries(D.MODULE_KEYS.map(k => [k, !om ? true : Array.isArray(om) ? om.includes(k) : om[k] !== false]));
    opts.players.forEach((po, i) => {
      const H = D.HOUSES[po.house];
      const p = {
        i, house: po.house, name: po.name || H.short, isBot: !!po.isBot, persona: po.persona || 'base', gold: R.startGold + (H.gold || 0),
        estates: [], regalia: [], great: [], deck: [], hand: [], discard: [], inPlay: [], plots: [],
        temp: { sci: 0, war: 0, int: 0 }, turn: freshTurn(), stats: { stolen: 0, sieges: 0, captured: 0, lost: 0, rollInc: 0, raidInc: 0, cardGold: 0, startInc: 0, trade: 0, siegeWins: 0 },
      };
      ['field', 'bakery', ...H.estates].forEach(id => p.estates.push({ uid: S.uid++, id }));
      p.deck = shuffle(S, [...Array(R.startTax).fill('tax'), ...H.deck]);
      S.players.push(p);
    });
    S.estateDeck = [];
    for (const id in D.ESTATES) { const d = D.ESTATES[id]; if (!d.basic) for (let k = 0; k < (d.copies || 3); k++) S.estateDeck.push(id); }
    shuffle(S, S.estateDeck);
    S.courtDeck = [];
    for (const id in D.COURT) { const c = D.COURT[id]; if (!c.start && !c.sig && cardOn(S, 'court', id)) for (let k = 0; k < 2; k++) S.courtDeck.push(id); }
    shuffle(S, S.courtDeck);
    S.estateRow = []; S.courtRow = [];
    refill(S);
    S.greatDeck = on(S, 'lords') ? shuffle(S, Object.keys(D.GREAT).filter(id => cardOn(S, 'great', id))) : [];
    S.greatRow = S.greatDeck.splice(0, R.greatRow);
    S.players.forEach(p => drawCards(S, p, handSize(S, p)));
    S.first = opts.first != null ? opts.first : Math.floor(rnd(S) * S.players.length);
    S.cur = S.first;
    S.players.forEach(p => { if (p.i !== S.first) p.gold += (R.seatGold || 0); });
    const se = D.SEASONS[0];
    log(S, `Партия началась. Цель — ${goalText(S)}.${on(S, 'seasons') ? ` ${se.icon} ${se.name}: ${seasonText(S, se)}` : ''}`, null, 'season');
    log(S, `Первый ход: ${nm(S.players[S.cur])}`, null, 'info');
    return S;
  }
  const goalText = (S) => needGreat(S) ? `${R.ownRegalia} вассалов и ${needGreat(S)} великих лорда` : `${R.ownRegalia} вассалов`;
  function refill(S) {
    while (S.estateRow.length < R.estateRow && S.estateDeck.length) S.estateRow.push(S.estateDeck.pop());
    while (S.courtRow.length < R.courtRow && S.courtDeck.length) S.courtRow.push(S.courtDeck.pop());
  }
  function drawCards(S, p, n) {
    let drawn = 0;
    for (let i = 0; i < n; i++) {
      if (!p.deck.length) {
        if (!p.discard.length) break;
        p.deck = shuffle(S, p.discard); p.discard = [];
      }
      p.hand.push(p.deck.pop()); drawn++;
    }
    return drawn;
  }

  // ---------- общение с игроком / ботом ----------
  async function ask(S, p, q) {
    if (p.isBot || !HOOKS.ask) return Bot.decide(S, p, q);
    return await HOOKS.ask(S, p, q);
  }

  // ---------- начало хода ----------
  async function startOfTurn(S, p) {
    p.turn = freshTurn();
    const m = mods(S, p);
    const counts = S.players.map(regCount);
    const max = Math.max(...counts);
    const leaders = counts.filter(c => c === max).length;
    const bal = on(S, 'balance');
    let envyPaid = 0, supportGot = 0;
    const tribute = [];
    if (bal && max > 0 && counts[p.i] === max && leaders === 1 && !m.envyImmune) {
      const second = Math.max(...counts.filter((c, i) => i !== p.i));
      const tax = Math.min(R.envyMax, max - second);
      const paid = Math.min(tax, p.gold);
      if (paid > 0) { p.gold -= paid; envyPaid = paid; log(S, `${nm(p)} заплатили Зависть: −${paid}🪙 (единственный лидер по знамёнам)`, p.i, 'envy'); }
    }
    if (bal && max - counts[p.i] >= R.supportGap) {
      p.gold += R.supportGold; supportGot = R.supportGold;
      log(S, `${nm(p)} получили Народную поддержку: +${R.supportGold}🪙 (отстают от лидера на ${D.banners(max - counts[p.i])})`, p.i, 'support');
    }
    let g = 0; const src = [];
    if (m.startGold) { g += m.startGold; src.push(`постоянный доход +${m.startGold}`); }
    if (m.interest) { const v = Math.min(m.interest, Math.floor(p.gold / 5)); if (v) { g += v; src.push(`проценты +${v}`); } }
    const pr = prod(S, p);
    for (const s of SYMS) if (m['symIncome_' + s]) { const v = Math.min(4, Math.floor(pr[s] / 2)); if (v) { g += v; src.push(`за ${D.SYM[s]} +${v}`); } }
    if (m.redIncome) { const v = Math.min(4, p.estates.filter(e => ES(e).t === 'raid').length); if (v) { g += v; src.push(`за набеги +${v}`); } }
    const uc = unionCount(p);
    if (m.unionGold && uc && on(S, 'unions')) { g += m.unionGold * uc; src.push(`за союзы +${m.unionGold * uc}`); }
    if (on(S, 'unions')) { const us = unionsOf(p).S; if (us) { g += us; src.push(`союз${us > 1 ? 'ы' : ''} Юга +${us}`); } }
    if (g > 0) { p.gold += g; p.stats.startInc += g; log(S, `${nm(p)} получили в начале хода +${g}🪙 (${src.join(', ')})`, p.i, 'gold'); }
    if (m.tribute) {
      for (const o of opps(S, p)) if (prod(S, o).war < pr.war && o.gold > 0) { o.gold -= 1; p.gold += 1; tribute.push(o.i); log(S, `Дань: ${nm(o)} отдали 1🪙 ${nmD(p)} — у них ⚔️ меньше`, p.i, 'steal'); }
    }
    emit(S, 'dawn', { p: p.i, gain: g, src, envy: envyPaid, support: supportGot, tribute });
    if (m.warCry) p.temp.war += m.warCry;
    const timed = p.plots.filter(x => x.kind === 'timed');
    for (const pl of timed) {
      p.plots.splice(p.plots.indexOf(pl), 1);
      await resolvePlot(S, p, pl, null);
      if (S.winner !== null) return;
    }
    emit(S, 'change');
  }

  async function resolvePlot(S, p, pl, active) {
    const c = D.COURT[pl.id];
    const m = mods(S, p);
    const g0 = p.gold;
    log(S, `${pl.kind === 'dice' ? '🎲' : '⏳'} ${nm(p)}: сработал замысел «${c.name}»`, p.i, 'plot');
    const entry = S.log[S.log.length - 1];
    await applyFx(S, p, c.pfx, { active, plot: true });
    const bonus = (m.plotGold || 0) + (pl.kind === 'timed' ? (m.timedPlotBonus || 0) : 0);
    if (bonus) p.gold += bonus;
    const dg = p.gold - g0;
    if (dg > 0) logAppend(S, entry, `: +${dg}🪙`, p.i, 'plot');
    p.discard.push(pl.id);
    emit(S, 'plot', { p: p.i, id: pl.id, kind: pl.kind, gold: dg, active: active ? active.i : null });
  }

  // ---------- эффекты карт ----------
  async function applyFx(S, p, fx, ctx = {}) {
    for (const op of fx) {
      const [k, a, b, c] = op;
      switch (k) {
        case 'gold': p.gold += a; break;
        case 'draw': drawCards(S, p, a); break;
        case 'temp': p.temp[a] += b; break;
        case 'goldPerCraft': { const n = p.estates.filter(e => ES(e).t === 'craft').length; p.gold += Math.min(b, n * a); break; }
        case 'goldPerSym': { const n = sym(S, p, a); p.gold += Math.min(c, n * b); break; }
        case 'buys': p.turn.buys += a; break;
        case 'discount': p.turn.discount += a; break;
        case 'regDiscount': p.turn.regDiscount += a; break;
        case 'reroll': if (!p.turn.rolled) p.turn.rerolls += a; break;
        case 'shift': if (!p.turn.rolled) p.turn.shifts.push(a); break;
        case 'forage': {
          const mine = sym(S, p, a);
          for (const o of opps(S, p)) {
            if (sym(S, o, a) < mine && o.gold > 0) {
              const amt = Math.min(b, o.gold); o.gold -= amt; p.gold += amt;
              log(S, `   ${nm(p)} забрали ${amt}🪙 у ${nmG(o)} — у ${shortG(o)} ${D.SYM[a]} меньше`, p.i, 'steal');
            }
          }
          break;
        }
        case 'siege': await doSiege(S, p, a, ctx); break;
        case 'spy': await doSpy(S, p, a, b, c, ctx); break;
        case 'trash': await doTrash(S, p, a); break;
        case 'board': {
          const os = opps(S, p).filter(o => o.gold > 0);
          if (!os.length) break;
          const o = os.reduce((x, y) => (y.gold > x.gold ? y : x));
          const amt = Math.min(sym(S, p, 'war') >= prod(S, o).war ? a : 1, o.gold);
          o.gold -= amt; p.gold += amt;
          log(S, `   Абордаж: ${nm(p)} забрали ${amt}🪙 у ${nmG(o)} (у них больше всего золота)`, p.i, 'steal');
          break;
        }
        case 'ambush': {
          const act = ctx.active;
          if (act && act !== p) {
            const amt = Math.min(a, act.gold); act.gold -= amt; p.gold += amt;
            if (amt) log(S, `   Засада: ${nm(p)} забрали ${amt}🪙 у ${nmG(act)} — они выбросили это число`, p.i, 'steal');
          } else { p.gold += a; }
          break;
        }
      }
      if (S.winner !== null) return;
    }
  }

  // ---------- осада ----------
  function siegeOdds(S, a, t, bonus) {
    // атака = войско этого хода (временная ⚔️) + бонус карты + способности; оборона = гарнизоны (⚔️ на столе) + стены
    const A = (a.temp.war || 0) + bonus + (mods(S, a).siege || 0);
    const Dv = prod(S, t).war + walls(S, t) + (mods(S, t).defense || 0);
    const adv = prod(S, t).sci > sym(S, a, 'sci');
    const dd = adv ? [1, 3, 5, 7, 9, 11].map(x => x / 36) : Array(6).fill(1 / 6);
    let pw = 0;
    for (let x = 1; x <= 6; x++) for (let y = 1; y <= 6; y++) if (A + x > Dv + y) pw += (1 / 6) * dd[y - 1];
    return { A, D: Dv, adv, p: pw };
  }
  function capturable(S, t, a, maxCost = 99) {
    if (mods(S, t).captureImmune) return [];
    return t.estates.filter(e => {
      const d = ES(e);
      if (d.fixed) return false;
      if (d.cost > maxCost) return false;
      if (d.limit && a.estates.some(x => x.id === e.id)) return false;
      return true;
    });
  }
  function moveEstate(S, from, to, uid) {
    const k = from.estates.findIndex(e => e.uid === uid);
    if (k < 0) return null;
    const [e] = from.estates.splice(k, 1);
    to.estates.push(e);
    return e;
  }
  async function doSiege(S, a, bonus, ctx) {
    const os = opps(S, a);
    if (!os.length) return;
    const options = os.map(o => { const el = capturable(S, o, a, R.siegeLoot); return { i: o.i, ...siegeOdds(S, a, o, bonus), loot: el.length, lootIds: el.map(e => e.id), gold: o.gold }; });
    const ti = await ask(S, a, { type: 'target', kind: 'siege', bonus, options });
    const t = S.players[ti];
    if (!t || t === a) return;
    const o = siegeOdds(S, a, t, bonus);
    const ar = d6(S);
    let dr = d6(S), dr2 = null;
    if (o.adv) { dr2 = d6(S); dr = Math.max(dr, dr2); }
    const A = o.A + ar, Dv = o.D + dr;
    a.stats.sieges++;
    log(S, `⚔️ Осада: ${nm(a)} нападают на ${nmG(t)} — атака ${o.A}+${ar}🎲 = ${A}, оборона ${o.D}+${dr}🎲${o.adv ? ' (лучший из 2)' : ''} = ${Dv}`, a.i, 'siege');
    const win = A > Dv;
    if (win) a.stats.siegeWins++;
    let got = null, gold = 0;
    if (win) {
      const el = capturable(S, t, a, R.siegeLoot);
      if (el.length) {
        const uid = await ask(S, a, { type: 'capture', from: t.i, options: el.map(e => e.uid) });
        const e = moveEstate(S, t, a, uid != null ? uid : el[0].uid);
        if (e) { got = e.id; a.stats.captured++; t.stats.lost++; log(S, `   ${nm(a)} победили и забрали владение «${ES(e).name}»`, a.i, 'win'); }
      } else {
        gold = Math.min(3, t.gold); t.gold -= gold; a.gold += gold;
        log(S, `   ${nm(a)} победили; забрать владение нельзя — взяли ${gold}🪙`, a.i, 'win');
      }
      const m = mods(S, a);
      if (m.siegeWinGold) { a.gold += m.siegeWinGold; }
      updateTitles(S);
    } else {
      log(S, `   ${nm(t)} отбились`, t.i, 'fail');
    }
    emit(S, 'siege', { a: a.i, t: t.i, A, D: Dv, ar, dr, dr2, win, got, gold });
    await pause(S, 'siege');
  }

  // ---------- шпионаж ----------
  function spyInfo(S, a, t, bonus) {
    const A = sym(S, a, 'int') + bonus + (mods(S, a).spy || 0);
    const G = (R.baseGuard || 0) + prod(S, t).int + (mods(S, t).guard || 0);
    if (R.spyDice) {
      let w = 0; for (let x = 1; x <= 6; x++) for (let y = 1; y <= 6; y++) if (A + x > G + y) w++;
      const p = w / 36;
      return { A, G, p, ok: p >= 0.5, bribe: null };
    }
    return { A, G, p: A > G ? 1 : 0, ok: A > G, bribe: 2 * Math.max(0, A - G) };
  }
  async function doSpy(S, a, bonus, effect, param, ctx) {
    const os = opps(S, a);
    if (!os.length) return;
    const options = os.map(o => ({ i: o.i, ...spyInfo(S, a, o, bonus), gold: o.gold, plots: o.plots.length, plotsOk: !!(o.plots.length && !mods(S, o).plotProtect), lootIds: effect === 'estate' ? capturable(S, o, a, param).map(e => e.id) : [] }));
    const ti = await ask(S, a, { type: 'target', kind: 'spy', bonus, effect, param, options });
    const t = S.players[ti];
    if (!t || t === a) return;
    const info = spyInfo(S, a, t, bonus);
    let bribeCost = info.bribe;
    let ar = null, gr = null;
    if (R.spyDice) {
      ar = d6(S); gr = d6(S);
      const At = info.A + ar, Gt = info.G + gr;
      if (At <= Gt) {
        log(S, `🗝 Шпионаж: ${nm(a)} против ${nmG(t)} — шпион ${info.A}+${ar}🎲 = ${At}, стража ${info.G}+${gr}🎲 = ${Gt}: провал`, a.i, 'fail');
        emit(S, 'spy', { a: a.i, t: t.i, ok: false, ar, gr });
        return;
      }
      log(S, `🗝 Шпионаж: ${nm(a)} против ${nmG(t)} — шпион ${info.A}+${ar}🎲 = ${At}, стража ${info.G}+${gr}🎲 = ${Gt}: удача`, a.i, 'siege');
      bribeCost = 2 * (At - Gt);
    } else if (!info.ok) {
      log(S, `🗝 Шпионаж: ${nm(a)} против ${nmG(t)} — шпион ${info.A}, стража ${info.G}: провал`, a.i, 'fail');
      emit(S, 'spy', { a: a.i, t: t.i, ok: false });
      return;
    }
    const ma = mods(S, a), mt = mods(S, t);
    let loss = 0;
    if (effect === 'steal') loss = Math.min(param + (ma.stealBonus || 0), t.gold);
    else if (effect === 'sabotage') loss = (t.plots.length && !mt.plotProtect) ? 4 : Math.min(param, t.gold);
    else if (effect === 'estate') { const el = capturable(S, t, a, param); loss = el.length ? Math.max(...el.map(e => ES(e).cost)) * 1.5 : 2; }
    if (t.gold >= bribeCost && loss > 0) {
      // что именно потеряет жертва, если не откупится — для окна выбора
      const steal = (n) => Math.min(n + (ma.stealBonus || 0), t.gold);
      const plotsOk = !!(t.plots.length && !mt.plotProtect);
      const el = effect === 'estate' ? capturable(S, t, a, param) : [];
      const what = effect === 'sabotage' && plotsOk ? { kind: 'plot', plots: t.plots.map(pl => pl.id) }
        : effect === 'estate' && el.length ? { kind: 'estate', ids: el.map(e => e.id) }
        : { kind: 'gold', amt: steal(effect === 'estate' ? 2 : param) };
      const pay = await ask(S, t, { type: 'bribe', cost: bribeCost, from: a.i, effect, param, loss, A: info.A, G: info.G, ar, gr, what });
      if (pay) {
        t.gold -= bribeCost;
        log(S, `   ${nm(t)} откупились от шпиона за ${bribeCost}🪙`, t.i, 'bribe');
        emit(S, 'spy', { a: a.i, t: t.i, ok: false, bribed: true, cost: bribeCost });
        return;
      }
    }
    if (effect === 'sabotage') {
      if (t.plots.length && !mt.plotProtect) {
        const k = Math.floor(rnd(S) * t.plots.length);
        const [pl] = t.plots.splice(k, 1);
        t.discard.push(pl.id);
        log(S, `   ${nm(a)} сорвали замысел ${nmG(t)}: «${D.COURT[pl.id].name}» ушёл в сброс`, a.i, 'steal');
        emit(S, 'spy', { a: a.i, t: t.i, ok: true });
        return;
      }
      effect = 'steal';
    }
    if (effect === 'estate') {
      const el = capturable(S, t, a, param);
      if (el.length) {
        const uid = await ask(S, a, { type: 'capture', from: t.i, options: el.map(e => e.uid) });
        const e = moveEstate(S, t, a, uid != null ? uid : el[0].uid);
        if (e) { a.stats.captured++; t.stats.lost++; log(S, `   Шантаж: владение «${ES(e).name}» переходит от ${nmG(t)} к ${nm(a)}`, a.i, 'steal'); }
        updateTitles(S);
        emit(S, 'spy', { a: a.i, t: t.i, ok: true });
        return;
      }
      effect = 'steal'; param = 2;
    }
    const amt = Math.min(param + (ma.stealBonus || 0), t.gold);
    t.gold -= amt; a.gold += amt; a.stats.stolen += amt;
    log(S, `   Кража: ${nm(a)} забрали ${amt}🪙 у ${nmG(t)}`, a.i, 'steal');
    emit(S, 'spy', { a: a.i, t: t.i, ok: true, amt });
  }

  async function doTrash(S, p, n) {
    if (!p.hand.length) return;
    const idxs = await ask(S, p, { type: 'trash', max: n });
    if (!Array.isArray(idxs) || !idxs.length) return;
    const sorted = [...new Set(idxs)].filter(i => i >= 0 && i < p.hand.length).sort((x, y) => y - x).slice(0, n);
    const names = [];
    for (const i of sorted) { const [id] = p.hand.splice(i, 1); names.push(D.COURT[id].name); }
    if (names.length) log(S, `   ${nm(p)} убрали из колоды навсегда: ${names.join(', ')}`, p.i, 'trash');
  }

  // ---------- розыгрыш карты ----------
  async function play(S, p, idx, opt = {}) {
    if (S.winner !== null || S.players[S.cur] !== p) return false;
    const id = p.hand[idx];
    if (!id) return false;
    const c = D.COURT[id];
    if (opt.plot) {
      if (!c.plot || p.plots.length >= plotSlots(S, p)) return false;
      p.hand.splice(idx, 1);
      let nums = null;
      if (c.plot === 'dice') {
        // число напечатано на карте; «соседние числа» (±1) — способность Дома Луны
        const sp = mods(S, p).plotSpread || 0;
        nums = [];
        for (let k = c.pn - sp; k <= c.pn + sp; k++) if (k >= 1 && k <= 12) nums.push(k);
      }
      p.plots.push({ id, kind: c.plot, nums, uid: S.uid++ });
      log(S, `${nm(p)} отложили карту замыслом ${c.plot === 'dice' ? '🎲 (сработает, когда выпадет её число)' : '⏳ (сработает в начале их следующего хода)'}`, p.i, 'plotset');
      emit(S, 'play', { p: p.i, id, plot: true, kind: c.plot });
      emit(S, 'change');
      return true;
    }
    p.hand.splice(idx, 1);
    p.inPlay.push(id);
    const ally = !!(c.role && p.turn.roles[c.role]);
    if (c.role) p.turn.roles[c.role] = (p.turn.roles[c.role] || 0) + 1;
    const g0 = p.gold, h0 = p.hand.length, t0 = { ...p.temp };
    log(S, `${nm(p)} сыграли «${c.name}»${ally && c.ally ? ' со свитой' : ''}`, p.i, 'play');
    const entry = S.log[S.log.length - 1];
    await applyFx(S, p, c.fx, {});
    if (ally && c.ally && S.winner === null) await applyFx(S, p, c.ally, {});
    const dg = p.gold - g0, dh = p.hand.length - h0;
    const temp = {}; for (const k of SYMS) if ((p.temp[k] || 0) > (t0[k] || 0)) temp[k] = p.temp[k] - (t0[k] || 0);
    const bits = [];
    if (dg > 0) { bits.push(`+${dg}🪙`); p.stats.cardGold += dg; }
    for (const k in temp) bits.push(`+${temp[k]}${D.SYM[k]} до конца хода`);
    if (dh > 0) bits.push(`взяли ${D.cards(dh)}`);
    if (bits.length) logAppend(S, entry, `: ${bits.join(', ')}`, p.i, 'play');
    emit(S, 'play', { p: p.i, id, ally: !!(ally && c.ally), gold: dg, cards: dh, temp });
    emit(S, 'change');
    return true;
  }

  // ---------- бросок ----------
  async function roll(S, p, n) {
    if (p.turn.rolled || S.winner !== null || S.players[S.cur] !== p) return false;
    const m = mods(S, p);
    if (n === 2 && !m.dice2) n = 1;
    let vals = rollVals(S, n);
    let rerolls = (m.reroll || 0) + p.turn.rerolls;
    let shifts = [...Array(m.shift || 0).fill(1), ...p.turn.shifts];
    let used = [];
    let adj = 0, harborUsed = false;
    emit(S, 'dice', { p: p.i, vals, n, adj });
    for (let guard = 0; guard < 20; guard++) {
      const total = clamp(sum(vals) + adj, 1, 12);
      const canHarbor = !!m.harbor && !harborUsed && n === 2 && sum(vals) + adj >= 10 && total < 12;
      if (!rerolls && !shifts.length && !canHarbor) break;
      const ch = await ask(S, p, { type: 'adjust', vals: vals.slice(), n, adj, total, rerolls, shifts: shifts.slice(), canHarbor });
      if (!ch || ch.a === 'accept') break;
      if (ch.a === 'reroll' && rerolls > 0) {
        rerolls--; vals = rollVals(S, n); adj = 0; harborUsed = false; shifts.push(...used); used = [];
        log(S, `${nm(p)} перебросили кубики`, p.i, 'dice');
      } else if (ch.a === 'shift') {
        const k = ch.k != null ? ch.k : shifts.findIndex(x => x >= Math.abs(ch.d));
        if (k < 0 || shifts[k] === undefined) break;
        const mag = shifts[k];
        const d = clamp(ch.d, -mag, mag);
        shifts.splice(k, 1); used.push(mag); adj += d;
      } else if (ch.a === 'harbor' && canHarbor) {
        adj += 2; harborUsed = true;
      } else break;
      emit(S, 'dice', { p: p.i, vals, n, adj });
    }
    const total = clamp(sum(vals) + adj, 1, 12);
    p.turn.rolled = true;
    S.lastRoll = { p: p.i, vals, n, adj, total };
    if (m.extraTurn && n === 2 && vals[0] === vals[1] && !S.extraTaken) p.turn.extraTurn = true;
    const raw = sum(vals);
    const vs = n === 2 ? `${vals[0]}+${vals[1]}${adj ? '' : ` = ${raw}`}` : `${vals[0]}`;
    log(S, `🎲 ${nm(p)} выбросили ${vs}${adj ? `, сдвиг ${adj > 0 ? '+' : '−'}${Math.abs(adj)} → ${total}` : ''}`, p.i, 'roll');
    emit(S, 'dice', { p: p.i, vals, n, adj, total, final: true });
    await resolveRoll(S, p, total);
    emit(S, 'change');
    return true;
  }

  function estateIncome(S, q, d, m) {
    let v;
    if (d.per === 'land') v = d.perN * q.estates.filter(e => ES(e).t === 'land').length;
    else if (d.per === 'provS') v = d.perN * q.estates.filter(e => ES(e).p === 'S').length;
    else if (d.per) v = d.perN * prod(S, q)[d.per];
    else v = d.inc;
    if (d.t === 'land') { v += (m.blueBonus || 0); if (m.winter && d.p !== 'N') v -= 1; }
    if (d.t === 'craft') v += (m.greenBonus || 0);
    return Math.max(0, v);
  }

  async function resolveRoll(S, a, r) {
    const N = S.players.length;
    const ev = [];
    for (let k = 1; k < N; k++) {
      const o = S.players[(a.i - k + N) % N];
      const m = mods(S, o);
      for (const e of o.estates) {
        const d = ES(e);
        if (d.t !== 'raid' || !d.n.includes(r)) continue;
        const amt = Math.min(Math.max(0, d.inc + (m.redBonus || 0) - (mods(S, a).raidShield || 0)), a.gold);
        if (amt > 0) { a.gold -= amt; o.gold += amt; o.stats.raidInc += amt; ev.push({ to: o.i, from: a.i, amt, src: d.name, id: e.id, uid: e.uid, t: 'raid' }); }
        else ev.push({ to: o.i, from: a.i, amt: 0, src: d.name, id: e.id, uid: e.uid, t: 'raid', zero: true });
      }
    }
    for (const q of S.players) {
      const m = mods(S, q);
      for (const e of q.estates) {
        const d = ES(e);
        if (!d.n.includes(r)) continue;
        if (d.t === 'land' || (d.t === 'craft' && q === a)) {
          const v = estateIncome(S, q, d, m);
          if (v > 0) { q.gold += v; q.stats.rollInc += v; ev.push({ to: q.i, amt: v, src: d.name, id: e.id, uid: e.uid, t: d.t }); }
        }
      }
    }
    {
      const m = mods(S, a);
      if (m.redOwn) for (const e of a.estates) {
        const d = ES(e);
        if (d.t !== 'raid' || !d.n.includes(r)) continue;
        const v = d.inc + (m.redBonus || 0);
        a.gold += v; a.stats.raidInc += v; ev.push({ to: a.i, amt: v, src: d.name, id: e.id, uid: e.uid, t: 'raid', own: true });
      }
      for (const e of a.estates) {
        const d = ES(e);
        if (d.t !== 'hold' || !d.n.includes(r)) continue;
        let left = d.cap || Infinity; // потолок за одно срабатывание (если задан)
        for (const o of opps(S, a)) {
          const amt = Math.min(Math.max(0, d.inc + (m.holdBonus || 0) - (mods(S, o).raidShield || 0)), o.gold, left);
          if (amt > 0) { o.gold -= amt; a.gold += amt; a.stats.raidInc += amt; left -= amt; ev.push({ to: a.i, from: o.i, amt, src: d.name, id: e.id, uid: e.uid, t: 'hold' }); }
          else ev.push({ to: a.i, from: o.i, amt: 0, src: d.name, id: e.id, uid: e.uid, t: 'hold', zero: true });
        }
      }
    }
    // сводка в журнал: по строке на игрока — что получил и что отдал
    const paid = ev.filter(x => x.amt > 0);
    if (!paid.length) log(S, `   Ни одно владение не принесло золота`, null, 'quiet');
    for (let k = 0; k < N; k++) {
      const q = S.players[(a.i + k) % N];
      const gain = paid.filter(x => x.to === q.i), loss = paid.filter(x => x.from === q.i);
      if (!gain.length && !loss.length) continue;
      const parts = gain.map(x => `+${x.amt}🪙 ${x.src}${x.from != null ? ` (у ${shortG(S.players[x.from])})` : ''}`)
        .concat(loss.map(x => `−${x.amt}🪙 ${x.src} ${shortG(S.players[x.to])}`));
      const net = sum(gain.map(x => x.amt)) - sum(loss.map(x => x.amt));
      log(S, `   ${nm(q)}: ${parts.join(', ')}${parts.length > 1 ? ` → итого ${net > 0 ? '+' : net < 0 ? '−' : ''}${Math.abs(net)}🪙` : ''}`, q.i, 'income');
    }
    emit(S, 'income', { r, ev: paid.concat(ev.filter(x => x.zero)), a: a.i });
    for (let k = 0; k < N; k++) {
      const q = S.players[(a.i + k) % N];
      const trig = q.plots.filter(pl => pl.kind === 'dice' && pl.nums && pl.nums.includes(r));
      for (const pl of trig) {
        q.plots.splice(q.plots.indexOf(pl), 1);
        await resolvePlot(S, q, pl, a);
      }
    }
  }

  // ---------- рынок ----------
  function marketPrice(S, p, base) {
    const m = mods(S, p);
    let c = Math.max(1, base - (m.marketDiscount || 0));
    return Math.max(0, c - p.turn.discount);
  }
  const buysLeft = (S, p) => 1 + p.turn.buys + (mods(S, p).buys || 0) - p.turn.buysUsed;
  const canOwnEstate = (p, id) => !(D.ESTATES[id].limit && p.estates.some(e => e.id === id));

  async function buy(S, p, src, key) {
    if (S.winner !== null || S.players[S.cur] !== p) return { ok: false, why: 'Сейчас не ваш ход' };
    if (!p.turn.rolled) return { ok: false, why: 'Сначала бросьте кубики' };
    let id = null;
    if (src === 'basic') id = D.ESTATES[key] && D.ESTATES[key].basic && cardOn(S, 'estate', key) ? key : null;
    else if (src === 'estate') id = S.estateRow[key];
    else if (src === 'court') id = S.courtRow[key];
    if (!id) return { ok: false, why: 'Карты нет' };
    const isEstate = src !== 'court';
    const def = isEstate ? D.ESTATES[id] : D.COURT[id];
    if (isEstate && !canOwnEstate(p, id)) return { ok: false, why: 'Такое владение может быть только одно' };
    const price = marketPrice(S, p, def.cost);
    const fm = mods(S, p).freeCheap || 0;
    const freeC = src === 'court' && ((p.turn.courtBought || 0) < (R.freeCourt || 0) || (R.courtPair && p.turn.courtPaid && !p.turn.courtBought));
    const freeX = !freeC && fm > 0 && !p.turn.cheapUsed && price <= fm;
    const freeB = !freeC && !freeX && src === 'basic' && !def.fixed && (mods(S, p).freeBasic || 0) > 0 && !p.turn.basicUsed;
    if (!freeC && !freeX && !freeB && buysLeft(S, p) <= 0) return { ok: false, why: 'Действия на этот ход закончились' };
    if (p.gold < price) return { ok: false, why: `Нужно ${price}🪙` };
    p.gold -= price; p.turn.discount = 0;
    if (freeC) p.turn.courtBought = (p.turn.courtBought || 0) + 1;
    else if (freeX) p.turn.cheapUsed = true;
    else if (freeB) p.turn.basicUsed = true;
    else { p.turn.buysUsed++; if (src === 'court') p.turn.courtPaid = true; }
    if (isEstate) p.estates.push({ uid: S.uid++, id }); else if (R.courtToTop) p.deck.push(id); else p.discard.push(id);
    if (src === 'estate') S.estateRow.splice(key, 1);
    if (src === 'court') S.courtRow.splice(key, 1);
    refill(S);
    log(S, `${nm(p)} купили ${isEstate ? 'владение' : 'карту двора'} «${def.name}» за ${price}🪙`, p.i, 'buy');
    emit(S, 'buy', { p: p.i, id, estate: isEstate, price });
    updateTitles(S);
    emit(S, 'change');
    return { ok: true };
  }

  // ---------- знамёна (вассалы и великие лорды) ----------
  function regCost(S, p, def) {
    const m = mods(S, p);
    const gold = Math.max(0, def.cost + R.rise * regCount(p) - p.turn.regDiscount - (m.regCheap || 0));
    const miss = {}; let missN = 0;
    for (const s of SYMS) {
      const need = (def.req && def.req[s]) || 0;
      miss[s] = Math.max(0, need - sym(S, p, s)); missN += miss[s];
    }
    const price = m.tradeCheap ? 1 : R.trade;
    const ok = !(def.req && def.req.unions) || unionCount(p) >= def.req.unions;
    return { gold, trade: missN * price, total: gold + missN * price, miss, missN, ok };
  }
  async function build(S, p, kind, id) {
    if (S.winner !== null || S.players[S.cur] !== p) return { ok: false, why: 'Сейчас не ваш ход' };
    if (!p.turn.rolled) return { ok: false, why: 'Сначала бросьте кубики' };
    if (buysLeft(S, p) <= 0) return { ok: false, why: 'Действия на этот ход закончились' };
    let def;
    if (kind === 'own') {
      def = regDef(p, id);
      if (!def || p.regalia.includes(id)) return { ok: false, why: 'Уже построено' };
    } else {
      if (!on(S, 'lords')) return { ok: false, why: 'Великие лорды в этой партии выключены' };
      if (!S.greatRow.includes(id)) return { ok: false, why: 'Этого лорда нет в ряду' };
      if (p.great.length >= needGreat(S)) return { ok: false, why: `У вас уже ${needGreat(S)} великих лорда` };
      def = D.GREAT[id];
    }
    const c = regCost(S, p, def);
    if (!c.ok) return { ok: false, why: 'Нужно 2 союза провинций' };
    if (p.gold < c.total) return { ok: false, why: `Нужно ${c.total}🪙` };
    p.gold -= c.total; p.stats.trade += c.trade; p.turn.built = true; p.turn.buysUsed++; p.turn.regDiscount = 0;
    if (kind === 'own') p.regalia.push(id);
    else {
      p.great.push(id);
      S.greatRow.splice(S.greatRow.indexOf(id), 1);
      if (S.greatDeck.length) S.greatRow.push(S.greatDeck.pop());
    }
    log(S, `🚩 ${nm(p)} привлекли ${kind === 'own' ? 'вассала' : 'великого лорда'} «${D.regName(def)}» за ${c.total}🪙${c.trade ? ` (из них ${c.trade}🪙 — докупка значков)` : ''}. Знамён: ${regCount(p)} из ${goal(S)}`, p.i, 'regalia');
    updateTitles(S);
    if (p.regalia.length >= R.ownRegalia && p.great.length >= needGreat(S)) {
      if (R.finishRound) {
        if (!S.finishers) S.finishers = [];
        if (!S.finishers.includes(p.i)) {
          S.finishers.push(p.i);
          log(S, `🏁 У ${nmG(p)} ${D.banners(goal(S))} — цель выполнена! Круг доигрывается до конца`, p.i, 'victory');
        }
      } else {
        S.winner = p.i;
        log(S, `🏆 Победа: ${nm(p)}, ${D.banners(goal(S))}`, p.i, 'victory');
      }
    }
    emit(S, 'change');
    emit(S, 'regalia', { p: p.i, id, kind, cost: c.total, trade: c.trade });
    return { ok: true };
  }

  // ---------- титулы ----------
  function updateTitles(S) {
    if (!on(S, 'titles')) return;
    const val = {
      treasurer: p => p.estates.length,
      magister: p => prod(S, p).sci,
      marshal: p => prod(S, p).war,
      whisperer: p => prod(S, p).int,
    };
    for (const t in val) {
      if (!cardOn(S, 'title', t)) continue;
      const min = D.TITLES[t].min;
      const arr = S.players.map(val[t]);
      const max = Math.max(...arr);
      const h = S.titles[t];
      let nh;
      if (h !== null && arr[h] >= min && arr[h] === max) nh = h;
      else {
        const tops = arr.map((v, i) => (v === max ? i : -1)).filter(i => i >= 0);
        nh = (max >= min && tops.length === 1) ? tops[0] : null;
      }
      if (nh !== h) {
        S.titles[t] = nh;
        const T = D.TITLES[t];
        if (nh !== null) log(S, `${T.icon} Титул «${T.name}» получили ${nm(S.players[nh])}`, nh, 'title');
        else log(S, `${T.icon} Титул «${T.name}» сейчас ни у кого`, null, 'title');
      }
    }
  }

  // ---------- ход целиком ----------
  function endTurn(S, p) {
    p.discard.push(...p.hand, ...p.inPlay);
    p.hand = []; p.inPlay = [];
    p.temp = { sci: 0, war: 0, int: 0 };
    updateTitles(S);
    drawCards(S, p, handSize(S, p));
    const extra = p.turn.extraTurn && !S.extraTaken;
    if (extra) {
      S.extraTaken = true;
      log(S, `${nm(p)} выбросили дубль: Укротитель виверн даёт ещё один ход`, p.i, 'extra');
    } else {
      S.extraTaken = false;
      S.cur = (S.cur + 1) % S.players.length;
      if (S.cur === S.first) {
        S.round++;
        if (on(S, 'seasons') && (S.round - 1) % R.seasonLen === 0) {
          S.seasonIdx = (S.seasonIdx + 1) % 4;
          const se = D.SEASONS[S.seasonIdx];
          log(S, `Наступает ${se.icon} ${se.name} — ${se.title}. ${seasonText(S, se)}`, null, 'season');
          emit(S, 'season', { idx: S.seasonIdx });
        }
      }
    }
    S.turnNo++;
    emit(S, 'change');
  }

  async function runTurn(S) {
    if (S.winner !== null) return;
    const p = S.players[S.cur];
    emit(S, 'turn', { p: p.i });
    await startOfTurn(S, p);
    if (S.winner !== null) return;
    if (p.isBot || !HOOKS.humanTurn) await Bot.takeTurn(S, p);
    else await HOOKS.humanTurn(S, p);
    if (S.winner !== null) return;
    if (!p.turn.rolled) await roll(S, p, 1); // ход без броска невозможен
    if (S.winner !== null) return;
    endTurn(S, p);
    if (R.finishRound && S.finishers && S.finishers.length && S.cur === S.first && !S.extraTaken) {
      const best = S.finishers.map(i => S.players[i]).sort((x, y) => y.gold - x.gold || y.estates.length - x.estates.length)[0];
      S.winner = best.i;
      log(S, `🏆 Победа: ${nm(best)}, ${D.banners(goal(S))}${S.finishers.length > 1 ? ' (при равенстве — больше золота)' : ''}`, best.i, 'victory');
      emit(S, 'change');
      return;
    }
    if (S.round > R.maxRounds && S.winner === null) {
      const best = [...S.players].sort((x, y) => regCount(y) - regCount(x) || y.gold - x.gold)[0];
      S.winner = best.i; S.timeout = true;
      log(S, `Время вышло. Победа по числу знамён: ${nm(best)}`, best.i, 'victory');
      emit(S, 'change');
    }
  }

  // ---------- вероятности ----------
  const TWO = [0, 0, 1, 2, 3, 4, 5, 6, 5, 4, 3, 2, 1];
  function pRoll(n, r) { if (n === 1) return r >= 1 && r <= 6 ? 1 / 6 : 0; return r >= 2 && r <= 12 ? TWO[r] / 36 : 0; }

  // ===================== БОТ =====================
  // «Характеры» ботов: веса типов владений, значков, ролей двора и темп набора знамён
  const PERSONAS = {
    base: { name: 'Обычный' },
    econ: { name: 'Экономист', type: { land: 1.3, craft: 1.3, raid: 0.7, hold: 0.8, wall: 0.6 }, role: { merchant: 1.7, knight: 0.5, spy: 0.5 } },
    war: { name: 'Воин', sym: { war: 3 }, type: { raid: 1.3, hold: 1.2, wall: 1.2 }, role: { knight: 1.8, merchant: 0.8, scholar: 0.6, spy: 0.6 }, aggro: 1.5 },
    spy: { name: 'Интриган', sym: { int: 3 }, type: { raid: 1.2, hold: 1.3 }, role: { spy: 1.8, merchant: 0.8, scholar: 0.7, knight: 0.6 }, aggro: 1.3 },
    sci: { name: 'Учёный', sym: { sci: 3 }, role: { scholar: 1.8, merchant: 0.9, knight: 0.6, spy: 0.7 }, plots: 1.6 },
    rush: { name: 'Охотник за знамёнами', recruit: 'fast' },
    deck: { name: 'Колодостроитель', role: { merchant: 2, scholar: 2, knight: 2, spy: 2 } },
  };
  // родной «характер» бота для каждого Дома
  const NATURAL = { deer: 'econ', owl: 'sci', wolf: 'war', rose: 'spy', serpent: 'war', moon: 'sci' };
  const Bot = {
    PERSONAS,
    P(p) { return PERSONAS[p.persona] || PERSONAS.base; },
    mode(S, q) { return mods(S, q).dice2 ? 2 : 1; },
    pNum(S, q, r) { return this.mode(S, q) === 2 ? 0.85 * pRoll(2, r) + 0.15 * pRoll(1, r) : pRoll(1, r); },
    rollValue(S, p, r) {
      let v = 0; const m = mods(S, p);
      for (const e of p.estates) {
        const d = ES(e);
        if (!d.n.includes(r)) continue;
        if (d.t === 'land' || d.t === 'craft') v += estateIncome(S, p, d, m);
        if (d.t === 'hold') { let h = 0; for (const o of opps(S, p)) h += Math.min(d.inc + (m.holdBonus || 0), o.gold); v += Math.min(h, d.cap || Infinity); }
        if (d.t === 'raid' && m.redOwn) v += d.inc + (m.redBonus || 0);
      }
      let g = p.gold;
      for (const o of opps(S, p)) {
        const mo = mods(S, o);
        for (const e of o.estates) { const d = ES(e); if (d.t === 'raid' && d.n.includes(r)) { const x = Math.min(d.inc + (mo.redBonus || 0), g); v -= x; g -= x; } }
      }
      for (const pl of p.plots) if (pl.kind === 'dice' && pl.nums && pl.nums.includes(r)) v += 4;
      return v;
    },
    rollEV(S, p, n) { let ev = 0; for (let r = 1; r <= 12; r++) { const pr = pRoll(n, r); if (pr) ev += pr * this.rollValue(S, p, r); } return ev; },
    diceCount(S, p) {
      if (!mods(S, p).dice2) return 1;
      return this.rollEV(S, p, 1) > this.rollEV(S, p, 2) + 0.05 ? 1 : 2;
    },
    horizon(S) { const mx = Math.max(...S.players.map(regCount)); return clamp(16 - 1.6 * mx * 8 / goal(S), 3, 14); },

    regOptions(S, p) {
      const out = [];
      for (const r of D.HOUSES[p.house].regalia) if (!p.regalia.includes(r.id)) out.push({ kind: 'own', id: r.id, def: r, cost: regCost(S, p, r) });
      if (p.great.length < needGreat(S)) for (const id of S.greatRow) out.push({ kind: 'great', id, def: D.GREAT[id], cost: regCost(S, p, D.GREAT[id]) });
      return out.filter(o => o.cost.ok);
    },
    target(S, p) {
      const os = this.regOptions(S, p);
      if (!os.length) return null;
      const dice = os.find(o => o.def.mods && o.def.mods.dice2);
      if (dice) return dice;
      // нужно и личные, и 2 великие — берём самое дешёвое с поправкой
      let best = null, bv = Infinity;
      for (const o of os) {
        let v = o.cost.total;
        if (o.kind === 'great') v -= 3; // великие могут увести
        if (v < bv) { bv = v; best = o; }
      }
      return best;
    },
    pickBuild(S, p, aff) {
      const dice = aff.find(o => o.def.mods && o.def.mods.dice2);
      if (dice) return dice;
      let best = null, bv = Infinity;
      for (const o of aff) {
        let v = o.cost.total;
        if (o.kind === 'great') v -= 4;
        if (v < bv) { bv = v; best = o; }
      }
      return best;
    },
    incomeEst(S, p) {
      const n = this.mode(S, p);
      let ev = this.rollEV(S, p, n);
      // доход на чужих бросках
      for (const o of opps(S, p)) for (let r = 1; r <= 12; r++) {
        const pr = this.pNum(S, o, r); if (!pr) continue;
        for (const e of p.estates) { const d = ES(e); if (d.t === 'land' && d.n.includes(r)) ev += pr * estateIncome(S, p, d, mods(S, p)); if (d.t === 'raid' && d.n.includes(r)) ev += pr * Math.min(d.inc, 2); }
      }
      return ev + 2.5;
    },
    allCards(p) { return [...p.deck, ...p.discard, ...p.hand, ...p.inPlay]; },
    power(S, p, id, avg) {
      const c = D.COURT[id];
      const val = (fx) => {
        let v = 0;
        for (const [k, a, b, cc] of fx || []) {
          switch (k) {
            case 'gold': v += a; break;
            case 'draw': v += a * avg; break;
            case 'temp': v += 0.6 * b; break;
            case 'goldPerCraft': v += Math.min(b, a * p.estates.filter(e => ES(e).t === 'craft').length); break;
            case 'goldPerSym': v += Math.min(cc, b * (prod(S, p)[a] + 0.5)); break;
            case 'buys': v += 1; break;
            case 'discount': v += a * 0.6; break;
            case 'regDiscount': v += a * 0.7; break;
            case 'reroll': v += 0.8; break;
            case 'shift': v += 0.6; break;
            case 'forage': v += b * opps(S, p).filter(o => prod(S, o)[a] < prod(S, p)[a] + 1).length * 0.8; break;
            case 'siege': v += 1.2 + 0.3 * a + 0.3 * (mods(S, p).siege || 0); break;
            case 'spy': v += 0.8 + 0.3 * a + 0.35 * prod(S, p).int + (b === 'estate' ? 1 : 0); break;
            case 'trash': v += 1.2; break;
            case 'board': v += 2; break;
          }
        }
        return v;
      };
      return val(c.fx) + 0.4 * val(c.ally);
    },
    avgPower(S, p) {
      const all = this.allCards(p);
      if (!all.length) return 1;
      let s = 0; for (const id of all) s += this.power(S, p, id, 1.2);
      return s / all.length;
    },
    symNeed(S, p, s) {
      let need = 0;
      const have = prod(S, p)[s];
      for (const o of this.regOptions(S, p)) { const r = (o.def.req && o.def.req[s]) || 0; if (r > have) need += 1; }
      return Math.min(3, need);
    },
    estateValue(S, p, id) {
      const d = D.ESTATES[id]; const m = mods(S, p);
      const pOwnN = (nums) => {
        if (mods(S, p).dice2) return nums.reduce((s, r) => s + this.pNum(S, p, r), 0);
        return nums.reduce((s, r) => s + 0.55 * pRoll(1, r) + 0.45 * pRoll(2, r), 0);
      };
      const pOthN = (nums) => opps(S, p).reduce((s, o) => s + nums.reduce((t, r) => t + this.pNum(S, o, r), 0), 0);
      const pr = prod(S, p);
      let amt;
      if (d.per === 'land') amt = d.perN * p.estates.filter(e => ES(e).t === 'land').length;
      else if (d.per === 'provS') amt = d.perN * (p.estates.filter(e => ES(e).p === 'S').length + 1);
      else if (d.per) amt = d.perN * (pr[d.per] + 1);
      else amt = d.inc;
      if (d.t === 'land') amt += (m.blueBonus || 0);
      if (d.t === 'craft') amt += (m.greenBonus || 0);
      let ev = 0;
      const own = pOwnN(d.n), oth = pOthN(d.n);
      if (d.t === 'land') ev = amt * (own + oth);
      else if (d.t === 'craft') ev = amt * own;
      else if (d.t === 'raid') ev = Math.min(amt + (m.redBonus || 0), 3) * oth * 0.85 + (m.redOwn ? (amt + (m.redBonus || 0)) * own : 0);
      else if (d.t === 'hold') ev = own * Math.min(d.cap || Infinity, opps(S, p).reduce((s, o) => s + Math.min(amt, Math.max(1, o.gold)), 0)) * 0.8;
      // синергия с уже имеющимися «за каждое»
      let syn = 0;
      for (const e of p.estates) {
        const x = ES(e);
        if (x.per === 'land' && d.t === 'land') syn += x.perN * pOwnN(x.n);
        if (x.per === 'provS' && d.p === 'S') syn += x.perN * pOwnN(x.n);
        if (x.per && x.per === d.sym) syn += x.perN * pOwnN(x.n);
      }
      const T = this.horizon(S);
      let val = (ev + syn) * T;
      if (d.sym) val += 1.2 + this.symNeed(S, p, d.sym) * 1.8;
      if (d.p && on(S, 'unions')) {
        // шаг к следующему союзу этой провинции: третье владение — союз
        const k = p.estates.filter(e => ES(e).p === d.p).length % 3;
        val += k === 2 ? 5 : k === 1 ? 1.5 : 0.5;
      }
      if (d.walls && on(S, 'sieges')) {
        // угроза осады: насколько соперники сильнее нашей обороны
        const myDef = prod(S, p).war + walls(S, p) + (m.defense || 0);
        const threat = Math.max(0, ...opps(S, p).map(o => (mods(S, o).siege || 0) + 4 - myDef));
        val += d.walls * (0.3 + Math.min(threat, 6) * 0.9);
      }
      const P = this.P(p);
      if (P.type && P.type[d.t] != null) val *= P.type[d.t];
      if (d.sym && P.sym && P.sym[d.sym]) val += P.sym[d.sym];
      return val;
    },
    courtValue(S, p, id) {
      const avg = this.avgPower(S, p);
      const c = D.COURT[id], P = this.P(p);
      const pw = this.power(S, p, id, avg) * ((P.role && c.role && P.role[c.role]) || 1);
      const n = this.allCards(p).length;
      const T = this.horizon(S);
      return T * handSize(S, p) * (pw - avg) / (n + 1);
    },
    bestPurchase(S, p, maxPrice = Infinity) {
      const opts = [];
      for (const id of ['field', 'bakery', 'wall']) if (cardOn(S, 'estate', id)) opts.push({ src: 'basic', key: id, id, estate: true });
      S.estateRow.forEach((id, k) => opts.push({ src: 'estate', key: k, id, estate: true }));
      S.courtRow.forEach((id, k) => opts.push({ src: 'court', key: k, id, estate: false }));
      let best = null, bs = 0.4;
      for (const o of opts) {
        const def = o.estate ? D.ESTATES[o.id] : D.COURT[o.id];
        if (o.estate && !canOwnEstate(p, o.id)) continue;
        const price = marketPrice(S, p, def.cost);
        if (price > p.gold || price > maxPrice) continue;
        let v = o.estate ? this.estateValue(S, p, o.id) : this.courtValue(S, p, o.id);
        if (!o.estate && R.courtPair && !p.turn.courtPaid) {
          let b2 = 0;
          S.courtRow.forEach((id2, k2) => { if (k2 === o.key) return; const p2 = marketPrice(S, p, D.COURT[id2].cost); if (p2 + price > p.gold) return; b2 = Math.max(b2, this.courtValue(S, p, id2) - p2); });
          v += b2;
        }
        const sc = v - price + rnd(S) * 0.6;
        if (sc > bs) { bs = sc; best = { ...o, price, score: sc }; }
      }
      return best;
    },
    okToSpend(S, p, price) {
      const t = this.target(S, p);
      if (!t) return true;
      const need = t.cost.total;
      const inc = this.incomeEst(S, p);
      if (p.gold + inc >= need && p.gold - price + inc < need) return false;
      if (this.P(p).save === 2 && p.gold + 2 * inc >= need && p.gold - price + 2 * inc < need) return false;
      return true;
    },
    handGold(S, p) {
      let g = 0;
      for (const id of p.hand) {
        for (const [k, a, b, c] of D.COURT[id].fx) {
          if (k === 'gold') g += a;
          if (k === 'goldPerCraft') g += Math.min(b, a * p.estates.filter(e => ES(e).t === 'craft').length);
          if (k === 'goldPerSym') g += Math.min(c, b * sym(S, p, a));
        }
      }
      return g;
    },
    wantPlot(S, p, id) {
      const c = D.COURT[id];
      if (!c.plot) return false;
      const t = this.target(S, p);
      if (c.fx.some(op => op[0] === 'siege')) {
        const best = Math.max(...opps(S, p).map(o => siegeOdds(S, p, o, c.fx.find(op => op[0] === 'siege')[1]).p));
        if (best < 0.45 / (this.P(p).aggro || 1)) return true;
      }
      if (c.fx.some(op => op[0] === 'spy')) {
        const ok = opps(S, p).some(o => spyInfo(S, p, o, c.fx.find(op => op[0] === 'spy')[1]).ok);
        if (!ok) return true;
      }
      const pg = mods(S, p).plotGold || 0;
      if (!t) return rnd(S) < (0.4 + 0.2 * pg) * (this.P(p).plots || 1);
      const afford = p.gold + this.handGold(S, p) >= t.cost.total;
      if (afford && pg < 2) return false;
      return rnd(S) < (0.6 + 0.15 * pg) * (this.P(p).plots || 1);
    },
    orderIndex(S, p) {
      const pri = (id) => {
        const fx = D.COURT[id].fx;
        if (fx.some(op => op[0] === 'draw')) return 0;
        if (fx.some(op => op[0] === 'temp')) return 1;
        if (fx.some(op => ['siege', 'spy', 'forage', 'board'].includes(op[0]))) return 4;
        if (fx.some(op => op[0] === 'trash')) return 3;
        return 2;
      };
      // ставим вперёд карту роли, которая уже сыграна (свита)
      let bi = 0, bv = Infinity;
      p.hand.forEach((id, i) => {
        const c = D.COURT[id];
        let v = pri(id);
        if (c.role && p.turn.roles[c.role] && c.ally) v -= 0.5;
        if (v < bv) { bv = v; bi = i; }
      });
      return bi;
    },
    async takeTurn(S, p) {
      await pause(S, 'start');
      let guard = 0;
      while (guard++ < 20) {
        const idx = p.hand.findIndex(id => D.COURT[id].fx.some(op => op[0] === 'draw' || op[0] === 'reroll' || op[0] === 'shift'));
        if (idx < 0) break;
        const id = p.hand[idx];
        if (D.COURT[id].plot === 'timed' && p.plots.length < plotSlots(S, p) && rnd(S) < 0.25) await play(S, p, idx, { plot: true });
        else await play(S, p, idx);
        await pause(S, 'play');
        if (S.winner !== null) return;
      }
      await roll(S, p, this.diceCount(S, p));
      await pause(S, 'roll');
      if (S.winner !== null) return;
      let plotted = 0; guard = 0;

  // что захваченное владение будет давать вам

      const has1 = q.shifts.some(x => x >= 1), has2 = q.shifts.some(x => x >= 2);
      const vs = q.vals.join('+');
      // что принесёт вам каждое число: ваши владения минус чужие Набеги (+ ваши 🎲-замыслы)
      const plotsOn = (r) => p.plots.filter(pl => pl.kind === 'dice' && pl.nums && pl.nums.includes(r)).length;
      const gold = (r) => Math.round(E.Bot.rollValue(S, p, r) - 4 * plotsOn(r));
      const fmt = (v) => (v > 0 ? `+${v}🪙` : v < 0 ? `−${-v}🪙` : '0🪙');
      const lab = (r) => `<small class="${gold(r) > 0 ? 'pos' : gold(r) < 0 ? 'neg' : ''}">${fmt(gold(r))}${plotsOn(r) ? ' +замысел' : ''}</small>`;
      const score = (r) => gold(r) + 4 * plotsOn(r);
      const opts = [];
      const sh = (d, ok) => { const r = Math.max(1, Math.min(12, q.total + d)); opts.push({ ok, v: score(r), html: `<button class="btn adjb" data-act="adj" data-d="${d}" ${ok ? '' : 'disabled'}><b>${d > 0 ? '+' : '−'}${Math.abs(d)} → ${r}</b>${ok ? lab(r) : '<small>—</small>'}</button>` }); };
      sh(-1, has1 && q.total > 1); sh(1, has1 && q.total < 12);
      if (has2) { sh(-2, q.total > 2); sh(2, q.total < 11); }
      const ev = E.Bot.rollEV(S, p, q.n);
      if (q.rerolls) opts.push({ ok: true, v: ev, html: `<button class="btn adjb" data-act="adj-reroll"><b>Переброс${q.rerolls > 1 ? ' ×' + q.rerolls : ''}</b><small>в среднем ${fmt(Math.round(ev * 10) / 10).replace('.', ',')}</small></button>` });
      if (q.canHarbor) { const r = Math.min(12, q.total + 2); opts.push({ ok: true, v: score(r), html: `<button class="btn adjb" data-act="adj-harbor"><b>Маяк → ${r}</b>${lab(r)}</button>` }); }
      const cur = score(q.total);
      const best = Math.max(cur, ...opts.filter(o => o.ok).map(o => o.v));
      const btns = opts.map(o => (o.ok && o.v === best && o.v > cur ? o.html.replace('class="btn adjb"', 'class="btn adjb best"') : o.html)).join('');
      return `<div class="adjw"><div class="adj-h">Выпало <b>${vs}${q.adj ? (q.adj > 0 ? ' +' : ' ') + q.adj : ''} = ${q.total}</b>: вам <b>${fmt(gold(q.total))}</b>${plotsOn(q.total) ? ' и замысел' : ''}. Под кнопками — что даст другое число.</div><div class="adj">
        ${btns}
        <button class="btn primary adjb" data-act="adj-ok"><b>Оставить ${q.total}</b>${lab(q.total)}</button></div></div>`;
    }
    if (isMyTurn()) {
      if (!p.turn.rolled) {
        const two = E.mods(S, p).dice2;
        return `<button class="btn primary" data-act="roll" data-n="1" ${busy ? 'disabled' : ''}>Бросить 🎲</button>${two ? `<button class="btn primary" data-act="roll" data-n="2" ${busy ? 'disabled' : ''}>Бросить 🎲🎲</button>` : ''}`;
      }
      const left = E.buysLeft(S, p);
      return `<div class="status"><b>Действий: ${left}</b><span class="muted">покупка или знамя</span></div><button class="btn primary" data-act="end" ${busy ? 'disabled' : ''}>Завершить ход</button>`;
    }
    const cur = S.players[S.cur];
    const sp = { slow: 'Медленно', normal: 'Обычно', fast: 'Быстро' }[speed];
    return `<div class="status"><b>${cur.i === ME ? 'Ваш ход начинается…' : `Ходят ${pname(cur)}`}</b><span class="muted">Скорость ботов: ${sp}</span></div>${WATCH ? `<button class="btn small" data-act="pause">${paused ? '▶︎' : '❚❚'}</button>` : ''}<button class="btn small" data-act="speed">⏩</button>`;
  }

  // ---------- игра: запуск ----------
  function startGame(watch, opts = {}) {
    runId++;
    closeAllSheets(); closeAllPages();
    endTurnResolve = null; adjustReq = null; busy = false; diceView = null; paused = false;
    rollView = null; turnRec = null; lastRec = null; nextReq = null;
    for (const k in goldSeen) delete goldSeen[k];
    for (const k in pops) delete pops[k];
    fixSetup();
    const houses = availHouses();
    let players;
    const bot = (h) => ({ house: h, isBot: true, persona: (E.NATURAL && E.NATURAL[h]) || 'base' });
    if (opts.tut) { players = [{ house: 'deer', isBot: false, name: D.HOUSES.deer.short + ' (вы)' }, bot('serpent')]; ME = 0; }
    else if (watch) { players = shuffleArr(houses).slice(0, setup.opps + 1).map(bot); ME = null; }
    else { players = [{ house: setup.house, isBot: false, name: D.HOUSES[setup.house].short + ' (вы)' }, ...shuffleArr(houses.filter(h => h !== setup.house)).slice(0, setup.opps).map(bot)]; ME = 0; }
    WATCH = watch;
    S = E.newGame(opts.tut ? { players, seed: TUT_SEED, first: 0, modules: D.PRESETS.basic.modules } : { players, modules: setup.mods });
    if (opts.tut) S.tut = { turns: 0, seen: [], q: [], off: false, lastInc: null };
    tab = 'hand';
    if (!opts.tut) savePrefs();
    window.scrollTo(0, 0);
    schedule();
    gameLoop();
  }
  function resumeGame(saved) {
    runId++;
    closeAllSheets();
    endTurnResolve = null; adjustReq = null; busy = false; paused = false;
    rollView = null; turnRec = null; lastRec = null; nextReq = null;
    for (const k in goldSeen) delete goldSeen[k];
    for (const k in pops) delete pops[k];
    S = JSON.parse(saved.S); ME = saved.ME; WATCH = !!saved.WATCH;
    for (const q of S.players) q.name = H(q).short + (q.isBot ? '' : ' (вы)');
    diceView = S.lastRoll ? { ...S.lastRoll, final: true } : null;
    schedule();
    gameLoop();
  }
  async function gameLoop() {
    const my = runId;
    try {
      while (S && S.winner === null) {
        if (my !== runId) return;
        saveSafe();
        const cur = S.players[S.cur];
        await E.runTurn(S);
        if (my !== runId) return;
        // после хода соперника — сводка и пауза до «Дальше»
        if (cur.isBot && ME !== null && !WATCH && S.winner === null && turnRec && turnRec.p === cur.i) {
          lastRec = turnRec;
          if (pauseBots) {
            await new Promise(res => { nextReq = { res }; schedule(); setTimeout(() => revealEl(app.querySelector('.tsum')), 60); });
            if (my !== runId) return;
          }
        }
      }
    } catch (e) {
      if (e instanceof Stale) return;
      console.error(e);
      toast('Ошибка: ' + esc(e.message), 6000);
      return;
    }
    if (my !== runId) return;
    clearSave();
    schedule();
    setTimeout(showResults, 500);
  }
  function showResults() {
    if (!S || S.winner === null) return;
    if (pageRoot.querySelector('.page.results:not(.out)')) return;
    const w = S.players[S.winner];
    const cap = modOn('sieges') || modOn('spy');
    const won = ME !== null && S.winner === ME;
    const list = [...S.players].sort((a, b) => (b.i === S.winner) - (a.i === S.winner) || E.regCount(b) - E.regCount(a) || b.gold - a.gold);
    const rows = list.map((q, k) => `<li class="${q.i === S.winner ? 'win' : ''} ${q.i === ME ? 'me' : ''}"><span class="rk">${k + 1}</span><img src="${IMG(`icons/h_${q.house}.svg`)}" alt=""><span class="nm"><b>${esc(q.i === ME ? `Вы · ${H(q).short}` : H(q).short)}</b><small>владений ${q.estates.length} · ${q.gold}🪙${cap ? ` · захватов ${q.stats.captured}` : ''}</small></span><span class="st"><b>🚩 ${E.regCount(q)}/${E.goal(S)}</b></span></li>`).join('');
    const title = ME !== null ? (won ? 'Победа!' : 'Партия окончена') : 'Партия окончена';
    const sub = won ? `Вы собрали ${D.banners(E.regCount(w))} за ${S.round} ${D.plural(S.round, 'круг', 'круга', 'кругов')}.` : `Победил ${esc(H(w).name)}${S.timeout ? ' — по числу знамён, время вышло' : ''}. Партия длилась ${S.round} ${D.plural(S.round, 'круг', 'круга', 'кругов')}.`;
    openPage({ title: 'Итоги', back: 'К столу', cls: 'results', body: `<div class="res-hero ${won ? 'won' : ''}"><div class="res-crest"><img src="${IMG(`icons/h_${w.house}.svg`)}" alt=""></div><h2>${title}</h2><p>${sub}</p></div>
      <ol class="podium">${rows}</ol>
      <div class="res-acts"><button class="btn primary big" data-act="new"><span>Новая партия</span></button><button class="btn big" data-act="home"><span>Главное меню</span></button></div>` });
  }

  // ---------- инфо-листы ----------
  // ---------- подробно по нажатию: простыми словами, с примером и с числами игрока ----------
  const pct = (x) => (x > 0 && x < 0.01 ? '<1' : String(Math.round(x * 100))) + '%';
  function chanceTxt(nums) {
    const p1 = nums.reduce((t, r) => t + E.pRoll(1, r), 0), p2 = nums.reduce((t, r) => t + E.pRoll(2, r), 0);
    return `1 кубик — ${p1 ? pct(p1) : 'никогда'}, 2 кубика — ${p2 ? pct(p2) : 'никогда'}`;
  }

  const subj = (o) => (!S ? null : o != null && o !== '' && S.players[+o] ? S.players[+o] : S.players[ME !== null ? ME : S.cur] || null);

  const exHtml = (rows) => `<div class="ex">${rows.filter(Boolean).map(([k, v, cls]) => `<div class="ex-r${cls ? ' ' + cls : ''}"><div class="ex-k">${k}</div><div class="ex-v">${v}</div></div>`).join('')}</div>`;

  function estateRows(id, q) {
    const d = D.ESTATES[id], nm = `«${esc(d.name)}»`, n = D.numText(d.n), n0 = d.n[0];
    const m = q ? E.mods(S, q) : {};

    if (d.t === 'wall') {
      rows.push(['Как работает', `От кубика не срабатывает. Даёт 🧱 +${d.walls} к обороне от осад: осаждающему нужно перебить ваши ⚔️ + 🧱 + кубик. Саму стену захватить нельзя.`]);
      if (!modOn('sieges')) rows.push(['В этой партии', 'Осады выключены — стена ничего не даёт.']);
    } else {
      const cnt = d.per === 'land' ? (x) => x.estates.filter(e => D.ESTATES[e.id].t === 'land').length
        : d.per === 'provS' ? (x) => x.estates.filter(e => D.ESTATES[e.id].p === 'S').length
        : d.per ? (x) => E.prod(S, x)[d.per] : null;
      const perTxt = d.per === 'land' ? 'за каждую вашу 🟦 Землю' : d.per === 'provS' ? 'за каждое ваше владение Юга (сам Порт тоже считается)' : d.per ? `за каждый ваш значок ${D.SYM[d.per]}` : '';
      const perIf = d.per === 'land' ? 'у вас 3 Земли' : d.per === 'provS' ? 'у вас 3 владения Юга' : d.per ? `у вас ${D.SYM[d.per]} 3` : '';
      let v = null, now = '';
      if (d.t === 'land' || d.t === 'craft') {
        if (q) {
          v = E.estateIncome(S, q, d, m);
          const bon = [];
          if (d.t === 'land' && m.blueBonus) bon.push(`+${m.blueBonus} с каждой Земли`);
          if (d.t === 'land' && m.winter && d.p !== 'N') bon.push('−1 зимой');
          if (d.t === 'craft' && m.greenBonus) bon.push(`+${m.greenBonus} с каждого Ремесла`);
          if (cnt) { const k = cnt(q); now = `${up1(atWho(q))} ${d.per === 'land' ? nOf(k, 'Земля', 'Земли', 'Земель') : d.per === 'provS' ? nOf(k, 'владение Юга', 'владения Юга', 'владений Юга') : `${D.SYM[d.per]} ${k}`}${bon.length ? `, бонусы: ${bon.join(', ')}` : ''} → ${v}🪙.`; }
          else if (bon.length) now = `С бонусами (${bon.join(', ')}) → ${v}🪙.`;
        }
      } else if (d.t === 'raid') {
        v = Math.max(0, d.inc + (m.redBonus || 0));
        if (q && m.redBonus) now = `С бонусом +${m.redBonus} к Набегам → ${v}🪙.`;
      } else {
        v = Math.max(0, d.inc + (m.holdBonus || 0));
        if (q && m.holdBonus) now = `С бонусом сезона → ${v}🪙 с каждого.`;
      }
      const v0 = v != null ? v : d.per ? d.perN * 3 : d.inc;
      const per0 = d.per && !q ? ` (если ${perIf})` : '';
      rows.push(['Когда', d.t === 'land' ? `Выпало ${n} на любом броске — вашем или чужом.`
        : d.t === 'craft' ? `Выпало ${n} на вашем броске. На чужом молчит.`
        : d.t === 'raid' ? `Выпало ${n} на чужом броске. На вашем молчит${m.redOwn ? ' — но у вас срабатывает и на своём, тогда золото из банка' : ''}.`
        : `Выпало ${n} на вашем броске.`]);
      rows.push(['Что даёт', d.t === 'land' || d.t === 'craft' ? `Золото из банка: ${d.per ? `${d.perN}🪙 ${perTxt}` : `${d.inc}🪙`}.`
        : d.t === 'raid' ? `Вы забираете ${d.inc}🪙 у того, кто бросал. Нет столько — берёте сколько есть. Набеги срабатывают раньше доходов: бросивший платит из того, что было у него до броска.`
        : `Вы забираете по ${d.inc}🪙 у каждого соперника${d.cap ? `, но всего не больше ${d.cap}🪙 за бросок` : ''}. С того, у кого золота нет, — ничего.`]);
      if (now) rows.push(['Сейчас', now, 'hl']);
      let ex;
      if (d.t === 'land') ex = `Соперник выбросил ${n0}. Его владения платят ему, а ${nm} — вам: +${v0}🪙${per0}, хотя бросали не вы.`;
      else if (d.t === 'craft') ex = `Вы выбросили ${n0} → +${v0}🪙${per0}. Соперник выбросил ${n0} → ${nm} молчит.`;
      else if (d.t === 'raid') { const t = Math.min(v0, 5); ex = `У соперника 5🪙, он выбросил ${n0} → вы забираете ${t}🪙, у него остаётся ${5 - t}🪙. Было бы у него 0🪙 — ничего.`; }
      else {
        const k = q ? S.players.length - 1 : 2, tot = v0 * k, capd = d.cap && tot > d.cap;
        ex = `${k === 1 ? 'У вас 1 соперник, у него есть золото' : `У вас ${nOf(k, 'соперник', 'соперника', 'соперников')}, у каждого есть золото`}. Вы выбросили ${n0} → по ${v0}🪙 с каждого${capd ? ` — это ${tot}🪙, но потолок ${d.cap}🪙: итого +${d.cap}🪙` : `: итого +${tot}🪙`}.`;
      }
      rows.push(['Пример', ex]);
      rows.push(['Шанс', `${up1(d.t === 'land' ? 'на каждом броске любого игрока' : d.t === 'raid' ? 'на каждом броске каждого соперника' : 'на каждом вашем броске')}: ${chanceTxt(d.n)}.`]);
    }
    if (d.sym) rows.push(['Значок', `${D.SYM[d.sym]} ${D.SYM_NAME[d.sym]} +1, пока владение ваше. Значки не тратятся — их нужно иметь: для требований вассалов${modOn('lords') ? ' и лордов' : ''}, для карт «за каждый значок»${modOn('titles') ? ', для титулов' : ''}.`]);
    if (d.walls && d.t !== 'wall' && modOn('sieges')) rows.push(['Стены', `🧱 +${d.walls} к обороне от осад.`]);
    if (d.p) { const pv = D.PROV[d.p]; rows.push(['Провинция', `${pv.icon} ${pv.name}.${modOn('unions') ? ` Каждые 3 владения этой провинции, можно одинаковые, — союз: ${pv.union}. Союзы копятся.` : ''}`]); }
    rows.push(['Где взять', `${d.cost}🪙. ${d.basic ? 'Всегда в продаже, без ограничений.' : `${d.copies || 3} шт. в колоде владений${d.limit ? '; у одного игрока — не больше одной' : ''}.`}`]);
    if (q) { const k = q.estates.filter(e => e.id === id).length; if (k) rows.push(['Есть', `${up1(atWho(q))}: ${k} шт.`]); }
    return rows;
  }

  // пояснения к эффектам карт двора; plot — для усиленного эффекта замысла
  function fxNotes(fx, q, plot) {
    const out = [];
    const m = q ? E.mods(S, q) : {};
    for (const [k, a, b, c] of fx || []) {
      if (k === 'reroll' && !plot) out.push('Играйте до броска. После броска появится выбор: принять число или перебросить кубики.');
      else if (k === 'shift' && !plot) out.push(`Играйте до броска. После броска число можно изменить на ${a > 1 ? `1–${a}` : '1'} в любую сторону — например, 6 превратить в 7, чтобы сработали ваши владения на 7.`);
      else if (k === 'draw' && !plot) out.push('Взятые карты можно сыграть в этот же ход.');
      else if (k === 'temp') out.push(`${D.SYM[a]} до конца хода считается как обычный значок — например, закрывает требование вассала. В конце хода пропадает.${a === 'war' && modOn('sieges') ? ' Для осады важны именно такие ⚔️: атакуют войска этого хода.' : ''}`);
      else if (k === 'goldPerCraft' && q) { const n = q.estates.filter(e => D.ESTATES[e.id].t === 'craft').length; out.push(`${up1(atWho(q))} ${nOf(n, 'Ремесло', 'Ремесла', 'Ремёсел')} → сейчас +${Math.min(b, n * a)}🪙.`); }
      else if (k === 'goldPerSym' && q) { const n = E.sym(S, q, a); out.push(`${up1(atWho(q))} ${D.SYM[a]} ${n} → сейчас +${Math.min(c, n * b)}🪙.`); }
      else if (k === 'buys') out.push('Действие — это покупка на рынке или привлечение знамени. Обычно оно одно за ход, с этой картой — на одно больше.');
      else if (k === 'discount') out.push('Скидка на одну следующую покупку на рынке в этот ход. Не потратили — сгорает.');
      else if (k === 'regDiscount') out.push('Скидка на знамя, привлечённое в этот ход. Не привлекли — сгорает.');
      else if (k === 'forage') {
        if (q) {
          const mine = E.sym(S, q, a), list = oppsOf(q).filter(o => E.sym(S, o, a) < mine && o.gold > 0);
          out.push(`${up1(atWho(q))} ${D.SYM[a]} ${mine}. Меньше — ${list.length ? `${list.map(o => `${esc(H(o).short)} (${E.sym(S, o, a)})`).join(', ')} → сейчас +${list.reduce((t, o) => t + Math.min(b, o.gold), 0)}🪙` : 'ни у кого: сейчас карта ничего не заберёт'}.`);
        } else out.push(`Забираете у каждого соперника, у кого ${D.SYM[a]} меньше, чем у вас. Временные ${D.SYM[a]} этого хода считаются.`);
      } else if (k === 'board') {
        const os = q ? oppsOf(q).filter(o => o.gold > 0) : [];
        if (os.length) {
          const o = os.reduce((x, y) => (y.gold > x.gold ? y : x)), w = E.prod(S, o).war, mine = E.sym(S, q, 'war');
          out.push(`Самый богатый сейчас — ${esc(H(o).short)}: ${o.gold}🪙, ⚔️ ${w}. ${up1(atWho(q))} ⚔️ ${mine} — ${mine >= w ? `не меньше, будет ${Math.min(a, o.gold)}🪙` : 'меньше, будет только 1🪙'}.`);
        } else out.push('Сравниваются ваши ⚔️ (с временными) и ⚔️ самого богатого соперника на столе.');
      } else if (k === 'siege') {
        if (!modOn('sieges')) out.push('В этой партии осады выключены.');
        else out.push(`Выберите соперника и его владение. Атака = ⚔️ этого хода + ${a} + кубик, оборона = его ⚔️ + 🧱 + кубик. Атака больше — забираете владение ценой до ${R.siegeLoot}🪙 или 3🪙. Если 📜 у защитника больше, он бросает 2 кубика и берёт лучший.${q && !plot ? ` ${up1(atWho(q))} атака сейчас: ${(q.temp.war || 0) + a + (m.siege || 0)} + кубик.` : ''}`);
      } else if (k === 'spy') {
        if (!modOn('spy')) out.push('В этой партии шпионаж выключен.');
        else out.push(`Сила = ваши 🔗 + ${a}${R.spyDice ? ' + кубик' : ''} против стражи = 🔗 соперника${R.spyDice ? ' + кубик' : ''}. Больше — успех (при равенстве провал), но жертва может откупиться: 2🪙 за каждое очко разницы.${q && !plot ? ` ${up1(atWho(q))} сила сейчас: ${E.sym(S, q, 'int') + a + (m.spy || 0)}${R.spyDice ? ' + кубик' : ''}.` : ''}`);
      } else if (k === 'trash') out.push('Убранные карты уходят из игры навсегда — обычно убирают «Подать». Колода становится меньше, и сильные карты приходят чаще.');
      else if (k === 'ambush') out.push(`Засада: если число выпало на чужом броске — забираете ${a}🪙 у бросившего, если на вашем — ${a}🪙 из банка.`);
    }
    return out;
  }
  function courtRows(id, q) {
    const c = D.COURT[id], role = c.role ? D.ROLES[c.role] : null;
    const rows = [['Сыграть', `${D.fxText(c.fx)}.`]];
    const notes = fxNotes(c.fx, q);
    if (notes.length) rows.push(['Подробно', notes.join('<br>')]);
    if (c.ally && role) {
      const other = Object.keys(D.COURT).find(k => k !== id && D.COURT[k].role === c.role && !D.COURT[k].sig && cardOk('court', k));
      rows.push(['Свита', `Если в этот ход вы уже сыграли другую карту роли ${role.icon} ${role.name}, эта даст ещё: ${lo1(D.fxText(c.ally))}.${other ? ` Например: сначала «${esc(D.COURT[other].name)}», потом «${esc(c.name)}».` : ''}`]);
    }
    if (c.plot && modOn('plots')) {
      const pf = lo1(D.fxText(c.pfx));
      const sp = q ? E.mods(S, q).plotSpread || 0 : 0;
      const nums = []; if (c.plot === 'dice') for (let k = c.pn - sp; k <= c.pn + sp; k++) if (k >= 1 && k <= 12) nums.push(k);
      rows.push(['Замысел', c.plot === 'dice'
        ? `Можно не играть, а положить на стол рубашкой вверх. Сработает, когда на любом броске — вашем или чужом — выпадет ${nums.join(', ')} (${chanceTxt(nums)}): ${pf}.`
        : `Можно не играть, а положить на стол рубашкой вверх. В начале вашего следующего хода сработает сильнее: ${pf}.`]);
      const pn = fxNotes(c.pfx, q, true);
      if (pn.length) rows.push(['', pn.join('<br>')]);
      rows.push(['Места', `Замыслов на столе — не больше ${q ? E.plotSlots(S, q) : R.plotSlots}. Сработавший замысел уходит в сброс.`]);
    }
    rows.push(['Где взять', c.start ? `Стартовая карта: ${R.startTax} шт. в колоде каждого Дома.` : c.sig ? 'Фамильная карта: одна, в стартовой колоде своего Дома.' : `${c.cost}🪙 на рынке. В колоде двора 2 копии.`]);
    if (role) rows.push(['Роль', `${role.icon} ${role.name} — считается для Свиты других карт этой роли.`]);
    return rows;
  }
  function regRows(def, kind, q, st) {
    const rows = [];
    const sp = CardFX.splitMods(def.mods, modOn);
    rows.push(['Что даёт', `${esc(def.text || '')}${sp.offK.length ? ` <span class="muted">Часть не действует: ${sp.offK.length > 1 ? 'модули' : 'модуль'} ${modList(sp.offK)} в этой партии выключен${sp.offK.length > 1 ? 'ы' : ''}.</span>` : ''}`]);
    const hs = kind === 'own' ? Object.keys(D.HOUSES).find(h => D.HOUSES[h].regalia.includes(def)) : null;
    rows.push(['Кто', kind === 'great' ? `Великий лорд из общего ряда, один на всю игру: кто первым привлёк, у того и остаётся. Для победы нужно ${R.greatNeeded}.` : `Вассал ${hs ? esc(D.HOUSES[hs].name.replace(/^Дом /, 'Дома ')) : 'Дома'}: привлечь его может только этот Дом. Для победы нужны все ${R.ownRegalia}.`]);
    if (st === 'built') rows.push(['Сейчас', q ? (q.i === ME ? 'Уже с вами.' : `Уже ${atWho(q)}.`) : 'Привлечён.', 'hl']);
    else if (st === 'taken') rows.push(['Сейчас', 'Уже у другого Дома.', 'hl']);
    const reqT = D.reqText(def.req);
    if (q && !st) {
      const c = E.regCost(S, q, def), m = E.mods(S, q), k = E.regCount(q);
      const parts = [`${def.cost}🪙`];
      if (k) parts.push(`+ ${R.rise * k}🪙 (${atWho(q)} уже ${D.banners(k)})`);
      if (m.regCheap) parts.push(`− ${m.regCheap}🪙 (способность Дома)`);
      if (q.turn.regDiscount) parts.push(`− ${q.turn.regDiscount}🪙 (скидка карты в этот ход)`);
      rows.push(['Цена', `${parts.length > 1 ? `${parts.join(' ')} = ` : ''}${c.gold}🪙. Каждое следующее знамя дороже на ${R.rise}🪙.`]);
      if (reqT) {
        const have = D.SYMS.filter(x => def.req[x]).map(x => `${D.SYM[x]} ${E.sym(S, q, x)}`).join(', ');
        const miss = D.SYMS.filter(x => c.miss[x]).map(x => D.SYM[x].repeat(c.miss[x])).join('');
        rows.push(['Значки', `Нужно иметь ${reqT} — значки не тратятся. ${up1(atWho(q))}: ${have}. ${c.missN ? `Не хватает ${miss} — докупка по ${m.tradeCheap ? 1 : R.trade}🪙 за значок: +${c.trade}🪙.` : 'Хватает.'}`]);
      }
      if (def.req && def.req.unions) rows.push(['Союзы', `Нужно ${def.req.unions} союза провинций. ${up1(atWho(q))}: ${E.unionCount(q)}.`]);
      rows.push(['Итого', `${c.total}🪙${c.ok ? '' : ' — и нужны союзы'}.`, 'hl']);
    } else if (reqT) rows.push(['Значки', `Нужно иметь ${reqT} — значки не тратятся. Нет нужного — докупка по ${R.trade}🪙 за значок.`]);
    if (!st) rows.push(['Когда', 'После броска, вместо покупки на рынке: это ваше действие хода.']);
    return rows;
  }
  function infoEstate(id, o) {
    const d = D.ESTATES[id], T = D.ETYPE[d.t];
    openSheet({ title: `${T.mark} ${esc(d.name)}`, body: `<div class="ex-card">${estateCard(id, '', null, { strip: true })}</div>${exHtml(estateRows(id, subj(o)))}` });
  }
  function infoCourt(id, o) {
    const c = D.COURT[id];
    openSheet({ title: esc(c.name), body: `<div class="ex-card">${courtCard(id, '', null, { strip: true })}</div>${exHtml(courtRows(id, subj(o)))}` });

  function infoReg(kind, key, o, st) {

    const def = kind === 'great' ? D.GREAT[key] : ((q && D.HOUSES[q.house].regalia.find(r => r.id === key)) || Object.values(D.HOUSES).flatMap(h => h.regalia).find(r => r.id === key));

      <div class="sec-h"><h3>Знамёна ${E.regCount(q)}/${E.goal(S)}</h3></div><div class="regs">${own.map(r => regRow(null, r, 'own', q.regalia.includes(r.id) ? 'built' : '', q.i)).join('')}${q.great.map(id => regRow(null, D.GREAT[id], 'great', 'built', q.i)).join('')}</div>

    openSheet({ title: `${H(q).sigil} ${esc(H(q).name)}`, body: `<div class="oppbody">${body}</div>` });
  }

  function showMenu() {

    pg.el.addEventListener('click', (e) => {
