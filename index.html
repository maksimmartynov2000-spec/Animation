      else if (k === 'speed') speed = v;
      else if (k === 'pause') { pauseBots = !pauseBots; if (!pauseBots && nextReq) { const r = nextReq; nextReq = null; r.res(); } }
      else if (k === 'tut' && S && S.tut) { S.tut.off = !S.tut.off; saveSafe(); }
      savePrefs(); schedule();
      pg.body.innerHTML = settingsHtml();
    });
  }
  function cycleSpeed() { speed = speed === 'normal' ? 'fast' : speed === 'fast' ? 'slow' : 'normal'; savePrefs(); toast(`Скорость ботов: ${{ slow: 'медленно', normal: 'обычно', fast: 'быстро' }[speed]}`, 1400); schedule(); }

  // ---------- правила: базовая игра + страница на каждый модуль (modrules.js) ----------
  function showRules() {
    const on = modOn;
    const cur = MODK.filter(on);
    const where = S ? 'В этой партии' : 'В выбранном наборе';
    let b = `<div class="rules">`;
    b += `<p class="note">Сначала — базовая игра. Модули добавляют по одной механике, у каждого своя страница с примерами. ${where} ${cur.length ? `включены: ${modList(cur)}` : 'модули выключены'}.</p>`;
    b += `<h3>Цель</h3><p>Первым собрать всех ${R.ownRegalia} вассалов своего Дома${on('lords') ? ` и ${R.greatNeeded} великих лорда (модуль «Великие лорды»)` : ''}. Когда кто-то выполнил цель, круг доигрывается до конца — у всех поровну ходов. Если цель выполнили несколько игроков, побеждает тот, у кого больше золота.</p>`;
    b += `<h3>Подготовка</h3><ul>
      <li>За престол борются 2–${R.maxPlayers} Дома. У каждого: Пашня, Пекарня и стартовые владения своего Дома; ${R.startGold}🪙 и золото Дома; колода — ${R.startTax}× Подать и 3 карты Дома, в руке ${R.hand}.</li>
      <li>Все, кроме первого игрока, получают ещё +${R.seatGold}🪙.</li>
      <li>Рынок: открыты ${R.estateRow} владения и ${R.courtRow} карты двора.</li></ul>`;
    b += `<h3>Ход</h3><ul>
      <li><b>Карты двора</b> из руки можно играть до броска и после, сколько угодно.</li>
      <li><b>Бросок:</b> 1 кубик. После первого вассала (у каждого Дома свой) можно выбирать 1 или 2 кубика. Бросок обязателен.</li>
      <li><b>Доход по кубику:</b> сначала 🟥 Набеги соперников, потом 🟦 Земли у всех и 🟩 Ремёсла у вас, потом ваши 🟪 Твердыни.</li>
      <li><b>Действие:</b> одно за ход — купить карту на рынке или привлечь вассала. Некоторые карты и вассалы дают ещё действие.</li>
      <li><b>Конец:</b> сыгранное и остаток руки — в сброс, берёте ${R.hand} новые карты. Колода кончилась — перемешайте сброс.</li></ul>`;
    b += `<h3>Владения</h3><ul>
      <li>🟦 <b>Земля</b> — доход на любом броске, в том числе чужом.</li><li>🟩 <b>Ремесло</b> — доход только на вашем броске.</li>
      <li>🟥 <b>Набег</b> — на чужом броске забирает золото у бросившего.</li><li>🟪 <b>Твердыня</b> — на вашем броске забирает золото у каждого соперника. Каждой — не больше одной у игрока.</li>
      <li><b>Копии.</b> Пашня и Пекарня всегда в продаже. Остальные владения — по 3 в колоде (Крепость и Гильдия воров — по 2). Карты двора — по 2.</li></ul>`;
    b += `<h3>Значки и вассалы</h3><p>📜 Свитки, ⚔️ Мечи и 🔗 Связи — значки на ваших картах. Они не тратятся: вассал требует, чтобы они у вас были. Недостающий значок докупается за ${R.trade}🪙. Каждое следующее знамя дороже на ${R.rise}🪙.</p>`;
    b += `<h3>Карты двора</h3><p>Роли: 🪙 Купец, 📜 Учёный, ⚔️ Рыцарь, 🔗 Шпион. <b>Свита</b> — бонус, если в этот ход вы уже сыграли карту той же роли.</p>`;
    b += `<h3>Пример первого хода</h3><div class="mr-ex"><b>Дом Оленя против Дома Змея</b><p>У вас 6🪙: 3 у всех и +3 от Дома. Играете Подать, Подать и Сборщика податей: +4🪙 (10). Выпало 4: сначала Казарма Змей забирает 2🪙 — 1 по карте и +1 от их Дома (8), потом ваша Лавка: +4🪙 (12). Действие: первый вассал, Томас Хейл, за 4🪙 − 2🪙 скидки Дома = 2🪙 (10). Со следующего хода можно бросать 2 кубика.</p></div>`;
    b += `<h3>Модули</h3><div class="optlist">${ModRules.ORDER.map(k => `<button class="opt" data-mr="${k}"><span class="big">${D.MODULES[k].icon}</span><span><b>${D.MODULES[k].name}</b><br><span class="muted">${D.MODULES[k].desc}</span></span><span class="r">${on(k) ? '<small>вкл.</small>' : ''}›</span></button>`).join('')}</div>`;
    b += `</div>`;
    const pg = openPage({ title: 'Правила', body: b });
    pg.el.addEventListener('click', (e) => { const x = e.target.closest('[data-mr]'); if (x) showModRules(x.dataset.mr); });
  }
  function showModRules(k) {
    const pg = ModRules.page(D, k, modOn);
    const st = modOn(k) ? `Модуль включён ${S ? 'в этой партии' : 'в выбранном наборе'}.` : `Модуль выключен ${S ? 'в этой партии' : 'в выбранном наборе'} — эти правила сейчас не действуют.`;
    openPage({ title: `${pg.icon} ${pg.name}`, body: `<div class="rules"><p class="note">${st}</p>${pg.html}</div>` });
  }
  function showCatalog(which = 'estates') {
    const world = modOn('seasons') || modOn('titles') || modOn('unions');
    const segs = [['estates', 'Владения'], ['court', 'Двор'], ['houses', 'Дома'], ...(modOn('lords') ? [['great', 'Лорды']] : []), ...(world ? [['world', [modOn('seasons') && 'Сезоны', modOn('titles') && 'титулы', modOn('unions') && 'союзы'].filter(Boolean).join(', ').replace(/^./, c => c.toUpperCase())]] : [])];
    const allOn = MODK.every(modOn);
    const head = allOn ? '' : `<p class="note">Показаны карты этой ${S ? 'партии' : 'настройки'}: без ${modList(MODK.filter(k => !modOn(k)))}.</p>`;
    const content = (w) => {
      if (w === 'estates') {
        const ids = Object.keys(D.ESTATES).filter(id => cardOk('estate', id)).sort((a, b) => (D.ESTATES[a].n[0] || 99) - (D.ESTATES[b].n[0] || 99));
        return `<p class="note">Пашня и Пекарня${cardOk('estate', 'wall') ? ', Каменная стена' : ''} — всегда в продаже. Остальные владения — по 3 копии в колоде (Крепость и Гильдия воров — по 2), в ряду рынка ${R.estateRow}.</p><div class="grid2">${ids.map(id => estateCard(id)).join('')}</div>`;
      }
      if (w === 'court') {
        const ids = Object.keys(D.COURT).filter(id => !D.COURT[id].sig && cardOk('court', id));
        const order = { null: 0, merchant: 1, scholar: 2, knight: 3, spy: 4 };
        ids.sort((a, b) => order[D.COURT[a].role] - order[D.COURT[b].role] || D.COURT[a].cost - D.COURT[b].cost);
        return `<p class="note">Каждая карта двора — по 2 копии в колоде, в ряду рынка ${R.courtRow}. «Подать» есть только в стартовых колодах (${R.startTax} шт. у каждого).</p><div class="grid2">${ids.map(id => courtCard(id)).join('')}</div>`;
      }
      if (w === 'houses') {
        return Object.keys(D.HOUSES).filter(h => { const k = needOf('house', h); return !k || modOn(k); }).map(h => { const x = D.HOUSES[h]; return `<div class="sec-h"><h3>${x.sigil} ${x.name}</h3><span>${x.path}</span></div><p class="muted" style="margin:0">${x.about}</p><p class="note">${x.ability}</p>
          <p style="margin:0;font-size:14px"><b>Старт:</b> Пашня, Пекарня, ${x.estates.map(id => D.ESTATES[id].name).join(', ')}; колода — ${R.startTax}× Подать, ${Object.entries(x.deck.reduce((m, id) => (m[id] = (m[id] || 0) + 1, m), {})).map(([id, n]) => (n > 1 ? n + '× ' : '') + D.COURT[id].name).join(', ')}.</p>
          <div class="ex-card">${courtCard(x.deck[x.deck.length - 1], '', null, { strip: true })}</div><div class="regs">${x.regalia.map(r => regRow(null, r, 'own', '')).join('')}</div>`; }).join('');
      }
      if (w === 'great') return `<p class="note">Колода — ${Object.keys(D.GREAT).filter(id => cardOk('great', id)).length} лордов по одному, в ряду лежат ${R.greatRow}. Каждого великого лорда может привлечь только один игрок; на его место выходит следующий.</p><div class="regs">${Object.keys(D.GREAT).filter(id => cardOk('great', id)).map(id => regRow(null, D.GREAT[id], 'great', '')).join('')}</div>`;
      let out = '';
      if (modOn('seasons')) out += `<div class="sec-h"><h3>Сезоны</h3><span>каждые ${R.seasonLen} круга</span></div><div class="regs">${D.SEASONS.map(s => { const sm = Object.assign({}, s.mods); if (!modOn('sieges')) delete sm.siege; if (!modOn('spy')) delete sm.spy; return `<div class="reg"><div class="rh"><span class="rn">${s.icon} ${s.name}</span><span class="rc">${s.title}</span></div><div class="rt">${FXc(CardFX.mods(sm))}</div></div>`; }).join('')}</div>`;
      if (modOn('titles')) out += `<div class="sec-h"><h3>Титулы</h3><span>переходят к сильнейшему</span></div><div class="regs">${Object.entries(D.TITLES).filter(([k]) => cardOk('title', k)).map(([k, t]) => `<div class="reg"><div class="rh"><span class="rn">${t.icon} ${t.name}</span></div><div class="rt">${FXc(CardFX.title(k))}</div><div class="muted" style="font-size:13px">Получает тот, у кого ${t.cond}.</div></div>`).join('')}</div>`;
      if (modOn('unions')) out += `<div class="sec-h"><h3>Провинции</h3><span>союз — каждые 3 владения</span></div><div class="regs">${Object.entries(D.PROV).map(([k, p]) => `<div class="reg"><div class="rh"><span class="rn">${p.icon} ${p.name}</span></div><div class="rt">${FXc(CardFX.union(k))}</div><div class="muted" style="font-size:13px">${Object.values(D.ESTATES).filter(d => d.p === k).map(d => d.name).join(', ')}</div></div>`).join('')}</div>`;
      return out;
    };
    if (!segs.some(x => x[0] === which)) which = 'estates';
    const pg = openPage({ title: 'Все карты', cls: 'catalog', body: `${head}<div class="seg catseg">${segs.map(([k, l]) => `<button data-seg="${k}" class="${k === which ? 'on' : ''}">${l}</button>`).join('')}</div><div class="catbody">${content(which)}</div>` });
    pg.el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-seg]'); if (!b) return;
      pg.el.querySelectorAll('[data-seg]').forEach(x => x.classList.toggle('on', x === b));
      pg.el.querySelector('.catbody').innerHTML = content(b.dataset.seg);
      pg.body.scrollTop = 0;
    });
  }

  // ---------- действия ----------
  async function guarded(fn) {
    if (busy) return;
    busy = true; schedule();
    try { await fn(); } catch (e) { if (!(e instanceof Stale)) { console.error(e); toast('Ошибка: ' + esc(e.message), 5000); } }
    finally { busy = false; schedule(); }
  }
  // подробности открываются на столе, в каталоге и в листе соперника (поверх него)
  const infoOk = (el) => !el.closest('.scrim') || !!el.closest('.catbody') || !!el.closest('.oppbody');
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.closest('.scrim') && !['new', 'info-estate', 'info-court', 'info-reg'].includes(el.dataset.act)) return;
    const a = el.dataset.act;
    const p = S ? S.players[ME !== null ? ME : S.cur] : null;
    switch (a) {
      case 'pick': if (houseOk(el.dataset.h)) { setup.house = el.dataset.h; savePrefs(); schedule(); } break;
      case 'opps': setup.opps = +el.dataset.n; fixSetup(); savePrefs(); schedule(); break;
      case 'preset': setup.mods = D.PRESETS[el.dataset.k].modules.slice(); fixSetup(); savePrefs(); schedule(); break;
      case 'mod': { const k = el.dataset.k; setup.mods = setupOn(k) ? setup.mods.filter(x => x !== k) : MODK.filter(x => x === k || setupOn(x)); fixSetup(); savePrefs(); schedule(); break; }
      case 'start': startGame(false); break;
      case 'watch': startGame(true); break;
      case 'tutorial': startGame(false, { tut: true }); break;
      case 'tut-ok': if (S && S.tut) { const id = el.dataset.id; if (!S.tut.seen.includes(id)) S.tut.seen.push(id); S.tut.q = S.tut.q.filter(x => x.id !== id); saveSafe(); schedule(); } break;
      case 'tut-off': if (S && S.tut) { S.tut.off = true; saveSafe(); toast('Подсказки выключены. Включить снова можно в меню ☰.', 3600); schedule(); } break;
      case 'continue': if (savedGame) { closeAllPages(); resumeGame(savedGame); } break;
      case 'rules': showRules(); break;
      case 'aid': showAid(); break;
      case 'catalog': showCatalog(); break;
      case 'menu': showMenu(); break;
      case 'log': if (S) showLog(); break;
      case 'tab': tab = el.dataset.tab; schedule(); break;
      case 'opp': infoOpp(+el.dataset.i); break;
      case 'info-estate': if (infoOk(el)) infoEstate(el.dataset.id, el.dataset.o); break;
      case 'info-court': if (infoOk(el)) { if (e.target.closest('button')) break; infoCourt(el.dataset.id, el.dataset.o); } break;
      case 'info-reg': if (infoOk(el)) { if (e.target.closest('button')) break; infoReg(el.dataset.kind, el.dataset.key, el.dataset.o, el.dataset.st); } break;
      case 'speed': cycleSpeed(); break;
      case 'pause': paused = !paused; schedule(); break;
      case 'results': showResults(); break;
      case 'new': goHome('setup', false); break;
      case 'home': if (S) goHome('home', S.winner === null); else { view = 'home'; schedule(); } break;
      case 'setup': view = 'setup'; schedule(); break;
      case 'settings': showSettings(); break;
      case 'next': if (nextReq) { const r = nextReq; nextReq = null; r.res(); schedule(); } break;
      case 'roll': if (isMyTurn()) guarded(() => E.roll(S, p, +el.dataset.n)); break;
      case 'adj': if (adjustReq) { const r = adjustReq; adjustReq = null; const d = +el.dataset.d; const k = r.q.shifts.reduce((best, mag, i) => (mag >= Math.abs(d) && (best < 0 || mag < r.q.shifts[best]) ? i : best), -1); r.res({ a: 'shift', k, d }); schedule(); } break;
      case 'adj-reroll': if (adjustReq) { const r = adjustReq; adjustReq = null; r.res({ a: 'reroll' }); schedule(); } break;
      case 'adj-harbor': if (adjustReq) { const r = adjustReq; adjustReq = null; r.res({ a: 'harbor' }); schedule(); } break;
      case 'adj-ok': if (adjustReq) { const r = adjustReq; adjustReq = null; r.res({ a: 'accept' }); schedule(); } break;
      case 'play': if (isMyTurn()) { e.stopPropagation(); const i = +el.dataset.i; guarded(async () => { await E.play(S, p, i); }); } break;
      case 'plot': if (isMyTurn()) { e.stopPropagation(); const i = +el.dataset.i; guarded(async () => { await E.play(S, p, i, { plot: true }); }); } break;
      case 'buy': if (isMyTurn()) { e.stopPropagation(); const src = el.dataset.src; const key = src === 'basic' ? el.dataset.key : +el.dataset.key; guarded(async () => { const r = await E.buy(S, p, src, key); if (!r.ok) toast(esc(r.why || 'Нельзя')); }); } break;
      case 'build': if (isMyTurn()) { const kind = el.dataset.kind; const id = kind === 'great' ? el.dataset.gid : el.dataset.id; guarded(async () => { const r = await E.build(S, p, kind, id); if (!r.ok) toast(esc(r.why || 'Нельзя')); else { const def = kind === 'great' ? D.GREAT[id] : E.regDef(p, id); toast(`🚩 «${esc(D.regName(def))}» теперь с вами — знамён ${E.regCount(p)} из ${E.goal(S)}`, 3200); } }); } break;
      case 'play-all': if (isMyTurn()) guarded(async () => {
        for (let g = 0; g < 20 && p.hand.length && isMyTurn(); g++) {
          const i = p.hand.findIndex(id => D.COURT[id].fx.some(op => op[0] === 'draw'));
          const j = i >= 0 ? i : p.hand.findIndex(id => !D.COURT[id].fx.some(op => ['siege', 'spy', 'forage', 'board', 'trash'].includes(op[0])));
          await E.play(S, p, j >= 0 ? j : 0);
          await wait(120);
        }
      }); break;
      case 'end': if (isMyTurn() && p.turn.rolled && !busy) { const res = endTurnResolve; endTurnResolve = null; res(); schedule(); } break;
    }
  });

  // ---------- запуск ----------
  function splash() {
    if (document.getElementById('splash')) return;
    const el = document.createElement('div');
    el.id = 'splash';
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = `<div class="sp-in"><img src="${IMG('icons/i_crown.svg')}" alt=""><b>Претенденты</b><span>карточная игра</span></div>`;
    document.body.appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), reduceMotion() ? 0 : 420); }, reduceMotion() ? 250 : 1000);
  }
  function boot(data) {
    loadPrefs();
    applyTheme();
    splash();
    if (data && data.save) { savedGame = { S: data.save, ME: data.ME, WATCH: data.WATCH }; resumeGame(savedGame); return; }
    render();
  }
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ save: S && S.winner === null ? lastSafe : null, ME, WATCH })); } catch (e) { /* нет хука */ }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
  window.__VD = { get S() { return S; }, get ME() { return ME; }, startGame, isMyTurn, get adjust() { return adjustReq; }, get waitNext() { return !!nextReq; }, get view() { return S ? 'game' : view; }, ask: (q) => askHuman(S.players[ME], q) };
})();

SymIcons.observe(document.body, (k) => (typeof ASSET_URL === 'function' ? ASSET_URL(`icons/i_${k}.svg`) : `icons/i_${k}.svg`));

</script>
</body>
</html>
